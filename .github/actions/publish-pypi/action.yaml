---
name: Publish to PyPI via Trusted Publishing
description: >
  Download the build artifact (which carries its own PEP 740 attestation
  sidecars, generated at build time) and upload everything to PyPI using
  OIDC-based Trusted Publishing (no long-lived API token).

# This composite action is a workaround for pypi/warehouse#11096: PyPI's
# Trusted Publisher config matches the OIDC `job_workflow_ref` claim against
# the *caller's* workflow file, but reusable workflows mint a token whose
# `job_workflow_ref` names the reusable workflow. Composite actions inherit
# the calling job's OIDC context, so invoking this action from a downstream
# caller's `release.yaml` keeps `job_workflow_ref` pointing at that file —
# which is what the downstream's PyPI Trusted Publisher must register.

inputs:
  artifact-name:
    description: Name of the dist artifact uploaded by the upstream build job.
    required: true
  repository-url:
    description: >
      Optional override for the PyPI repository URL (e.g., TestPyPI). Leave
      empty to publish to the canonical PyPI index.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: false
        # Downstream callers invoke this action without a checkout (the codegen drops it: see
        # _render_publish_pypi_job in repomatic/github/workflow_sync.py), so the empty workdir
        # is by design and setup-uv's warning about it is noise.
        ignore-empty-workdir: true
        version: "0.12.0"

    - name: Download build artifact
      id: download
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/

    - name: Push to PyPI
      env:
        DOWNLOAD_PATH: ${{ steps.download.outputs.download-path }}
        REPOSITORY_URL: ${{ inputs.repository-url }}
      shell: bash
      run: |
        args=(--no-progress publish --trusted-publishing automatic)
        if [[ -n "${REPOSITORY_URL}" ]]; then
          args+=(--publish-url "${REPOSITORY_URL}")
        fi
        uv "${args[@]}" "${DOWNLOAD_PATH}"/*

    # `uv publish` above only confirms the upload was accepted; PyPI's index/CDN
    # can take up to a few minutes to make the new version resolvable everywhere.
    # Downstream automation that reacts immediately to this workflow completing
    # (a caller bumping a pin to the version just published, or a
    # self-referential project like repomatic syncing its own workflow refs
    # against itself) can race that propagation window and fail with a spurious
    # "no version of X==Y" resolution error. Block here until the published
    # version is actually visible, so nothing downstream inherits the race.
    - name: Wait for PyPI propagation
      if: inputs.repository-url == ''
      env:
        DOWNLOAD_PATH: ${{ steps.download.outputs.download-path }}
      shell: bash
      run: |
        sdist=$(ls "${DOWNLOAD_PATH}"/*.tar.gz | head -1)
        base=$(basename "${sdist}" .tar.gz)
        pkg_version="${base##*-}"
        pkg_name="${base%-*}"
        echo "Waiting for ${pkg_name} ${pkg_version} to become visible on PyPI..."
        for attempt in $(seq 1 20); do
          if curl --fail --silent --show-error --output /dev/null \
              "https://pypi.org/pypi/${pkg_name}/${pkg_version}/json"; then
            echo "Visible after ${attempt} attempt(s) (~$(( (attempt - 1) * 15 ))s)."
            exit 0
          fi
          sleep 15
        done
        msg="${pkg_name} ${pkg_version} was not visible on PyPI within 5 minutes of publishing."
        msg="${msg} Downstream automation pinning to this version may fail transiently"
        msg="${msg} until propagation catches up."
        echo "::error::${msg}" >&2
        exit 1
