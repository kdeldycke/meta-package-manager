---
# TEMPORARY probe workflow, to be deleted once validated. It exercises the
# flagship `doas` claim on the host that motivated it: Alpine, whose base
# system ships no `sudo`, escalating `apk` through its own doas build, driven
# by an unprivileged user (container steps run as root, and root never
# escalates). No JS action runs inside the container: they are glibc-linked
# and die on musl, so checkout is a manual fetch and tooling comes from apk.
name: 🧪 alpine doas probe
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/alpine-doas-probe.yaml

env:
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  alpine:
    name: apk through doas on Alpine
    runs-on: ubuntu-26.04
    container:
      image: alpine:edge
    steps:
      - name: Set the stage as root
        run: |
          # The base image ships no package index, and --no-cache would keep it
          # that way: populate it so the unprivileged user's availability
          # search can see the catalog.
          apk update
          apk add doas git python3 uv
          uv --version
          if command -v sudo; then echo "sudo present, premise broken"; exit 1; fi
          adduser -D probe
          printf 'permit nopass probe as root\n' > /etc/doas.conf
          chmod 0400 /etc/doas.conf
          git clone --depth 1 https://github.com/kdeldycke/meta-package-manager /home/probe/mpm
          git -C /home/probe/mpm fetch --depth 1 origin "$GITHUB_SHA"
          git -C /home/probe/mpm checkout "$GITHUB_SHA"
          chown -R probe: /home/probe

      - name: Measure who can see the apk index
        shell: sh {0}
        run: |
          echo "--- caches ---"
          ls -la /var/cache/apk/ 2>&1; ls -la /etc/apk/ 2>&1
          cat /etc/apk/repositories
          echo "--- search as root ---"
          apk search --verbose tree | head -3; echo "root-exit=$?"
          echo "--- search as probe ---"
          su probe -s /bin/sh -c 'apk search --verbose tree; echo "probe-exit=$?"' 2>&1 | head -6

      - name: Install mpm as the unprivileged user
        run: |
          cat > /home/probe/setup.sh << 'EOF'
          set -e
          export HOME=/home/probe
          cd /home/probe/mpm
          uv sync --no-progress --python /usr/bin/python3
          EOF
          chown probe: /home/probe/setup.sh
          su probe -s /bin/sh /home/probe/setup.sh

      - name: Escalate apk through the auto-detected doas
        run: |
          cat > /home/probe/run1.sh << 'EOF'
          export HOME=/home/probe
          cd /home/probe/mpm
          doas -n true && echo "doas warm for probe"
          uv run --no-progress --frozen -- mpm --verbosity INFO --apk \
            install tree > out.txt 2>&1
          echo "mpm exit=$?"
          tail -30 out.txt
          EOF
          chown probe: /home/probe/run1.sh
          su probe -s /bin/sh /home/probe/run1.sh
          # No --sudo-command was passed: with no sudo on the host, detection
          # alone must have picked doas and the install must have landed.
          grep -E '\$ doas -n .*apk' /home/probe/mpm/out.txt
          grep -q "Found the doas credential cache warm" /home/probe/mpm/out.txt
          grep -q "cannot be refreshed on a schedule" /home/probe/mpm/out.txt
          apk info -e tree

      - name: Assert the denial path on a revoked rule
        run: |
          apk del tree
          printf 'permit nopass root as root\n' > /etc/doas.conf
          cat > /home/probe/run2.sh << 'EOF'
          export HOME=/home/probe
          cd /home/probe/mpm
          uv run --no-progress --frozen -- mpm --verbosity INFO --apk \
            install tree > out2.txt 2>&1 || true
          tail -20 out2.txt
          EOF
          chown probe: /home/probe/run2.sh
          su probe -s /bin/sh /home/probe/run2.sh
          grep -q "not authorized to run doas" /home/probe/mpm/out2.txt
          if apk info -e tree; then echo "install went through a denial"; exit 1; fi
