---
name: 🆙 Changelog & versions
"on":
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - changelog.md
      - "**/pyproject.toml"
      - ".github/workflows/*.yaml"
      - uv.lock
      - "**/*.py"
      - "docs/**"
  workflow_run:
    workflows:
      - "🚀 Build & release"
    types:
      - completed
    branches:
      - main

jobs:

  changelog:
    uses: kdeldycke/repomatic/.github/workflows/changelog.yaml@69cfe3259bda727942bcffe4a382d341cae69c44 # v7.12.1
    secrets:
      REPOMATIC_PAT: ${{ secrets.REPOMATIC_PAT }}
