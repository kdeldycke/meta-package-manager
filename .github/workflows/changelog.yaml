---
name: 🆙 Changelog & versions
"on":
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main
    paths:
      - changelog.md
      - "**/pyproject.toml"
      - ".github/workflows/*.yaml"
      - uv.lock
      - "**/*.py"
      - "docs/**"
  workflow_run:
    workflows:
      - "🚀 Build & release"
    types:
      - completed
    branches:
      - main

jobs:

  changelog:
    uses: kdeldycke/repomatic/.github/workflows/changelog.yaml@d4e5f1199c8756fe04b12d5e864c2535fd9f3739 # v7.18.0
    secrets:
      REPOMATIC_PAT: ${{ secrets.REPOMATIC_PAT }}
