---
name: 🧪 Validate MacPorts packages
"on":
  workflow_dispatch:

# Temporary workflow to validate the MacPorts ports staged in
# packaging/macports/: meta-package-manager 7.5.0 plus its py-click-extra 8.8.1,
# py-cloup 3.1.0, py-deepmerge 2.1.0, py-extra-platforms 13.6.0,
# py-packageurl-python 0.17.6 and py-boltons 26.1.0 dependencies, plus the
# py-hjson (312/313/314) and py-myst-parser (5.0.0, 311-314) updates and the new
# py-pytest-param-files / py-sphinx-pytest ports that let py-myst-parser test
# again and click-extra's suite resolve on py314. Installs
# MacPorts on a macOS runner, registers the overlay as a local port source, then
# lints every port and runs meta-package-manager's `port test` phase.
# That test phase is the one thing the upstream submission cannot cover on its
# own: the macports-ports PR CI builds and installs the ports but never runs
# `port test`, and no local machine here has MacPorts.
# Mirrors the upstream submission:
# https://github.com/macports/macports-ports/pull/33746
# Delete after the ports land upstream.

permissions: {}

jobs:

  validate:
    name: Lint, test and install the MacPorts overlay
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5

      - name: Install MacPorts base
        # Resolve the .pkg matching the runner's macOS major at run time, so the
        # pin never goes stale as the runner image or MacPorts base advances.
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          osmajor="$(sw_vers -productVersion | cut -d. -f1)"
          url="$(gh api repos/macports/macports-base/releases/latest \
            | jq -r --arg os "$osmajor" \
                '.assets[] | select(.name | test("-\($os)-[A-Za-z]+[.]pkg$")) | .browser_download_url')"
          test -n "$url"
          echo "Installing MacPorts from $url"
          curl -fsSLO "$url"
          sudo installer -pkg MacPorts-*.pkg -target /
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          echo "/opt/local/sbin" >> "$GITHUB_PATH"

      - name: Sync the MacPorts port tree
        # selfupdate pulls the rsync ports tree so the overlay's own dependencies
        # (python314, py314-pytest, ...) resolve against upstream MacPorts.
        timeout-minutes: 20
        run: sudo port -v selfupdate

      - name: Register the overlay as a local port source
        # Copy the overlay out of the runner's 0700 home into a world-readable
        # path first: MacPorts privilege-drops to the `macports` user for build
        # and test, which otherwise cannot read Portfiles under /Users/runner
        # ("Permission denied" opening the Portfile). A file:// source ahead of
        # the rsync tree makes the overlay's newer versions win.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          overlay=/opt/local/var/macports/overlay
          sudo mkdir -p "${overlay}"
          sudo cp -R "${GITHUB_WORKSPACE}/packaging/macports/." "${overlay}/"
          conf=/opt/local/etc/macports/sources.conf
          { printf 'file://%s [nosync]\n' "${overlay}"; cat "${conf}"; } \
            | sudo tee "${conf}.new" >/dev/null
          sudo mv "${conf}.new" "${conf}"
          (cd "${overlay}" && sudo portindex)
          sudo chmod -R a+rX "${overlay}"
          # Confirm the overlay Portfile wins over the rsync tree.
          port file meta-package-manager

      - name: Lint every overlay port
        timeout-minutes: 10
        run: |
          set -uo pipefail
          fail=0
          for port in py-boltons py-deepmerge py-packageurl-python \
                      py-extra-platforms py-cloup py-click-extra \
                      py-hjson py-myst-parser py-pytest-param-files \
                      py-sphinx-pytest meta-package-manager; do
            echo "::group::port lint ${port}"
            port -q lint "${port}" || fail=1
            echo "::endgroup::"
          done
          exit "${fail}"

      - name: Run every port's test phase
        # `port test` builds each port with its overlay dependencies, then runs
        # its test.cmd (pytest). The library ports set test.run inside the
        # `if {${name} ne ${subport}}` guard, so their test phase lives on the
        # versioned subport (py314-*), not the py-* stub, which no-ops. mpm is an
        # application, tested directly. py-myst-parser 5.0.0 is tested here now
        # that py-pytest-param-files + py-sphinx-pytest exist. click-extra is
        # exercised separately below, kept non-fatal because its suite is CI-coupled.
        # Continue on failure so one port's result doesn't mask the others.
        timeout-minutes: 90
        run: |
          set -uo pipefail
          fail=0
          for port in py314-extra-platforms py314-cloup py314-packageurl-python \
                      py314-myst-parser meta-package-manager; do
            echo "::group::port test ${port}"
            sudo port -v test "${port}" || fail=1
            echo "::endgroup::"
          done
          exit "${fail}"

      - name: Build the test-only dependency ports
        # These carry no test phase of their own, so build+install the py314
        # subports to prove they fetch, resolve and compile on 3.14: py-hjson
        # (3.1.0 + 312/313/314) and the two new py-pytest-param-files /
        # py-sphinx-pytest ports that let py-myst-parser (and click-extra) test.
        timeout-minutes: 30
        run: sudo port -v install py314-hjson py314-pytest-param-files py314-sphinx-pytest

      - name: Test click-extra (non-fatal, CI-coupled suite)
        # click-extra's deps now resolve on py314 and its suite passes there
        # (3881 passed, 0 failed), so the submission enables this test phase too.
        # Kept non-fatal here because the suite pins exact sphinx/pygments/version
        # output to click-extra's CI, so a later MacPorts dep bump could
        # reintroduce failures without meaning the packaging is broken.
        timeout-minutes: 30
        run: sudo port -v test py314-click-extra || true

      - name: Install and smoke-test the CLI
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo port -v install meta-package-manager
          mpm --version
          mpm --help >/dev/null
