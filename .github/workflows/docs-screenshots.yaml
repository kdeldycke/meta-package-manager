---
name: 📸 Documentation screenshots
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs-screenshots.yaml
      - docs/gnome_screenshots_update.py
      - docs/outdated-sample.json
      - gnome-shell/mpm@kdeldycke.github.io/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Photograph the GNOME Shell extension's menu, from a real shell.
#
# Everything in the image is genuine: a headless `gnome-shell` renders the real
# extension, with the real theme, fonts and icon set, and the shell's own
# screenshot service takes the picture. Only the package data is held still, by
# a stand-in `mpm` serving `docs/outdated-sample.json`, so the capture documents
# the extension instead of whatever the runner had outdated that morning. See
# `docs/gnome_screenshots_update.py` for the rationale of each stub.
#
# The macOS half of the same job cannot exist: photographing an Xbar or SwiftBar
# menu needs Screen Recording and Accessibility grants that a hosted runner has
# no way to give, and a hosted macOS display is 1x besides. GNOME is where a real
# capture is reachable from CI at all, which is why this workflow starts here.
#
# Scheduled on nothing: the images move when the extension or the payload moves,
# and a cron would only manufacture churn. The trigger paths deliberately exclude
# `docs/assets/`, so merging this job's own pull request cannot retrigger it.

# Supply-chain cooldown: no package published within the window can be resolved
# by any command in this workflow. Held equal to `[tool.repomatic]
# minimum-release-age`. See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  update-gnome-screenshots:
    name: Capture the GNOME Shell extension menu
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Recommends would drag in a desktop session nobody here logs into, so each
      # one the capture actually needs is named instead: the symbolic icons the
      # extension asks the theme for, `dbus-run-session`, GNOME's UI font (without
      # it fontconfig lands on whatever it likes and the images drift), the GTK4
      # and libadwaita typelibs `prefs.js` imports, `gsettings` and
      # `glib-compile-schemas`, and the Mesa software rasterizer, a runner having
      # no GPU to render the session with.
      #
      # `gnome-shell-extension-prefs` is the one that reads like a duplicate and
      # is not: opening an extension's preferences is a D-Bus call the shell
      # forwards to `org.gnome.Shell.Extensions`, and while `gnome-shell` ships
      # that service's activation file, the `gnome-extensions-app` binary it
      # execs ships here. Without it the name simply fails to activate, and
      # `gnome-extensions prefs` exits 2.
      - name: Install GNOME Shell
        run: >
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          adwaita-icon-theme
          dbus-bin
          fonts-cantarell
          gir1.2-adw-1
          gir1.2-gtk-4.0
          gnome-shell
          gnome-shell-extension-prefs
          gsettings-desktop-schemas
          libgl1-mesa-dri
          libglib2.0-bin

      # The shell version is what the extension's `metadata.json` declares support
      # for, so a runner image moving past that range fails the capture below
      # rather than silently shipping an unsupported combination. Recorded in the
      # summary, and carried into the pull request body.
      - name: Record the GNOME Shell version
        run: |
          printf 'SHELL_VERSION=' >> "${GITHUB_ENV}"
          gnome-shell --version >> "${GITHUB_ENV}"
          {
            echo '## Capture host'
            echo '```'
            gnome-shell --version
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # One session bus for the whole capture: the driver spawns the shell on it,
      # and talks to it over the same bus. The shell runs on the headless backend,
      # which needs no display server of its own; should a runner image ever fail
      # to bring it up, the fallback is a nested session under `xvfb-run`.
      - name: Capture the menus
        run: >
          dbus-run-session --
          python3 docs/gnome_screenshots_update.py --workspace "${RUNNER_TEMP}/capture"

      # The per-shot shell logs are the only diagnosis a failed capture leaves,
      # and a headless GNOME fails in ways no exit code explains.
      - name: Upload the session logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnome-capture-logs
          path: ${{ runner.temp }}/capture/*.log
          if-no-files-found: warn

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pin what CI downloads: unpinned, setup-uv installs the newest uv
          # satisfying `required-version`. `sync-workflow-pins` bumps it once a
          # uv release clears the cooldown window.
          version: "0.12.1"

      # The oxipng `format-images` provisions, keyed on the file carrying the
      # repomatic pin that decides its version: a bump misses the cache once and
      # repopulates it, and a stale hit is re-verified against the registry
      # checksum rather than trusted.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-oxipng-${{
            hashFiles('.github/workflows/docs-screenshots.yaml') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-oxipng-

      # Literally the command the autofix lane runs, rather than the binary it
      # drives: `run oxipng` is a passthrough, so reaching for it means restating
      # repomatic's optimization level, strip mode and savings thresholds here,
      # where the next upstream change to any of them would go unnoticed and
      # leave `format-images` rewriting these files right back, one pull request
      # per capture. It discovers images repo-wide and rewrites only what clears
      # its own threshold, so the already-optimized rest of the tree is a no-op.
      - name: Optimize the captures
        run: |
          set -euo pipefail
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.13.0' \
            format-images | tee --append "${GITHUB_STEP_SUMMARY}"

      # One call for what three steps did by hand. It opens the pull request when
      # the captures moved, refreshes it when they move again, does nothing at all
      # when they match what is already on the branch, and closes it, branch and
      # all, once a change is reverted: that last state is the one a hand-rolled
      # upsert never handled, leaving a stale PR open forever. The branch name and
      # the label come from the template, so no step repeats them. `--add-path` is
      # a git pathspec, quoted so git expands it rather than the shell, and one
      # matching nothing is dropped instead of fatal.
      - name: Sync pull request
        env:
          # The PAT when the repository has one, so the PR it opens triggers the
          # checks a `GITHUB_TOKEN`-authored one never would.
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.13.0'
          pr-sync --template-file .github/pr-templates/update-gnome-screenshots.md
          --template-arg shell_version="${SHELL_VERSION}"
          --add-path 'docs/assets/gnome-shell-*.png'

  # An investigation, not a capture lane: dispatch-only, and nothing downstream
  # depends on it. A first probe settled the question this one builds on: these
  # runners disable SIP, run a full Aqua session, and ship `kTCCServiceScreenCapture`
  # and `kTCCServiceAccessibility` already granted to `/bin/bash` and `osascript`,
  # so both photographing another process and driving its menu bar are permitted
  # out of the box. What is left to prove is the chain: SwiftBar installed,
  # rendering a plugin, its menu opened and photographed.
  probe-macos:
    name: Probe what a macOS runner can photograph
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    permissions: {}
    timeout-minutes: 20
    env:
      # Pinned and checksummed: SwiftBar publishes a plain zip, so the cask (and
      # a registry with no cooldown knob) stays out of this entirely.
      SWIFTBAR_URL: https://github.com/swiftbar/SwiftBar/releases/download/v2.1.1/SwiftBar.v2.1.1.b597.zip
      SWIFTBAR_SHA256: fcdec490782d6587046304044951c63de49ac422fc63892a6fab2dd7bc70c0cd
    steps:
      - name: What the display offers
        run: |
          system_profiler SPDisplaysDataType | head -20 || true
          which displayplacer || echo "displayplacer absent"

      - name: Install SwiftBar
        run: |
          set -euo pipefail
          curl --silent --show-error --location --fail \
            --output "${RUNNER_TEMP}/swiftbar.zip" "${SWIFTBAR_URL}"
          echo "${SWIFTBAR_SHA256}  ${RUNNER_TEMP}/swiftbar.zip" | shasum --algorithm 256 --check
          ditto -x -k "${RUNNER_TEMP}/swiftbar.zip" /Applications
          xattr -dr com.apple.quarantine /Applications/SwiftBar.app || true
          defaults read /Applications/SwiftBar.app/Contents/Info.plist CFBundleShortVersionString

      - name: Plant a plugin and start SwiftBar
        run: |
          set -euo pipefail
          plugins="${RUNNER_TEMP}/plugins"
          mkdir -p "${plugins}"
          cat > "${plugins}/probe.1h.sh" <<'PLUGIN'
          #!/bin/bash
          echo "🎁↑3 | dropdown=false"
          echo "---"
          echo "brew - 2 packages | font=Menlo size=12"
          echo "wget            1.21.4 → 1.25.0 | font=Menlo size=12"
          echo "curl            8.7.1 → 8.11.0  | font=Menlo size=12"
          echo "---"
          echo "npm - 1 package | font=Menlo size=12"
          echo "typescript      5.9.2 → 5.9.3   | font=Menlo size=12"
          PLUGIN
          chmod +x "${plugins}/probe.1h.sh"
          # Setting the folder up front is what keeps the first run from stopping
          # on its folder picker.
          defaults write com.ameba.SwiftBar PluginDirectory "${plugins}"
          # By path, not by name: Launch Services has never seen this bundle, so
          # `open -a SwiftBar` cannot resolve it. Registering it first also lets
          # anything else address it by name later.
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks
          lsregister="${lsregister}/LaunchServices.framework/Support/lsregister"
          "${lsregister}" -f /Applications/SwiftBar.app || true
          open /Applications/SwiftBar.app
          sleep 20
          pgrep -l SwiftBar || echo "SwiftBar is not running"

      # The first capture is what raises macOS 26's screen-recording consent
      # sheet, so it is spent deliberately and the sheet dismissed before any
      # shot that matters. Accessibility is granted, so the click is scriptable.
      - name: Spend the consent prompt
        run: |
          screencapture -x -t png "${RUNNER_TEMP}/warmup.png" || true
          osascript -e 'tell application "System Events" to click button "Allow" \
            of window 1 of process "universalAccessAuthWarn"' || true
          osascript -e 'tell application "System Events" to keystroke return' || true
          sleep 3
          screencapture -x -t png "${RUNNER_TEMP}/after-consent.png" || true

      - name: Open the SwiftBar menu and photograph it
        run: |
          set -euo pipefail
          osascript -e 'tell application "System Events" to tell process "SwiftBar" \
            to click menu bar item 1 of menu bar 2' || true
          sleep 3
          cat > "${RUNNER_TEMP}/menu.js" <<'JS'
          ObjC.import("CoreGraphics");
          ObjC.import("Foundation");
          const raw = $.CGWindowListCopyWindowInfo(17, 0);
          const list = ObjC.castRefToObject(raw);
          const rows = [];
          for (let i = 0; i < list.count; i++) {
              const w = list.objectAtIndex(i);
              rows.push({
                  id: ObjC.unwrap(w.objectForKey("kCGWindowNumber")),
                  owner: ObjC.unwrap(w.objectForKey("kCGWindowOwnerName")),
                  layer: ObjC.unwrap(w.objectForKey("kCGWindowLayer")),
              });
          }
          JSON.stringify(rows);
          JS
          osascript -l JavaScript "${RUNNER_TEMP}/menu.js" | tee "${RUNNER_TEMP}/windows.json"
          # The open menu is a window of SwiftBar's own, on the pop-up menu layer.
          cat > "${RUNNER_TEMP}/pick.py" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1], encoding="UTF-8"))
          menus = [r for r in rows if r["owner"] == "SwiftBar" and r["layer"] >= 101]
          print(menus[0]["id"] if menus else "")
          PY
          menu_id=$(python3 "${RUNNER_TEMP}/pick.py" "${RUNNER_TEMP}/windows.json")
          echo "menu window: ${menu_id:-none}"
          screencapture -x -o -t png ${menu_id:+-l${menu_id}} "${RUNNER_TEMP}/menu.png" || true
          screencapture -x -t png "${RUNNER_TEMP}/fullscreen-with-menu.png" || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: macos-probe
          path: |
            ${{ runner.temp }}/*.png
            ${{ runner.temp }}/windows.json
          if-no-files-found: warn
