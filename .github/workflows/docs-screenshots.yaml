---
name: 📸 Documentation screenshots
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/docs-screenshots.yaml
      - docs/bar_screenshots_update.py
      - docs/gnome_screenshots_update.py
      - docs/outdated-sample.json
      - gnome-shell/mpm@kdeldycke.github.io/**
      - meta_package_manager/bar_plugin.py
      - meta_package_manager/bar_plugin_renderer.py

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Photograph both desktop menus, each from a real desktop.
#
# Everything in the images is genuine: a headless `gnome-shell` renders the real
# extension, with the real theme, fonts and icon set, and the shell's own
# screenshot service takes the picture, while on macOS the two bar apps run for
# real and their menus are captured by window id. Only the package data is held
# still, by a stand-in `mpm` serving `docs/outdated-sample.json`, so a capture
# documents the frontend rather than whatever the runner had outdated that
# morning. See `docs/gnome_screenshots_update.py` and
# `docs/bar_screenshots_update.py` for the rationale of each stub.
#
# The macOS half was written off as impossible first: photographing an Xbar or
# SwiftBar menu needs Screen Recording and Accessibility, which a hosted runner
# was assumed to withhold. Measured instead of assumed, `macos-26` ships both
# already granted to `/bin/bash` and `osascript`, and runs with SIP disabled, so
# the second job is real. What the runner does not offer is a HiDPI display: its
# screen is 1x, where the GNOME job renders at 2x on a virtual monitor it sizes
# itself.
#
# Scheduled on nothing: the images move when the extension or the payload moves,
# and a cron would only manufacture churn. The trigger paths deliberately exclude
# `docs/assets/`, so merging this job's own pull request cannot retrigger it.

# Supply-chain cooldown: no package published within the window can be resolved
# by any command in this workflow. Held equal to `[tool.repomatic]
# minimum-release-age`. See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  update-gnome-screenshots:
    name: Capture the GNOME Shell extension menu
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Recommends would drag in a desktop session nobody here logs into, so each
      # one the capture actually needs is named instead: the symbolic icons the
      # extension asks the theme for, `dbus-run-session`, GNOME's UI font (without
      # it fontconfig lands on whatever it likes and the images drift), the GTK4
      # and libadwaita typelibs `prefs.js` imports, `gsettings` and
      # `glib-compile-schemas`, and the Mesa software rasterizer, a runner having
      # no GPU to render the session with.
      #
      # `gnome-shell-extension-prefs` is the one that reads like a duplicate and
      # is not: opening an extension's preferences is a D-Bus call the shell
      # forwards to `org.gnome.Shell.Extensions`, and while `gnome-shell` ships
      # that service's activation file, the `gnome-extensions-app` binary it
      # execs ships here. Without it the name simply fails to activate, and
      # `gnome-extensions prefs` exits 2.
      - name: Install GNOME Shell
        run: >
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          adwaita-icon-theme
          dbus-bin
          fonts-cantarell
          gir1.2-adw-1
          gir1.2-gtk-4.0
          gnome-shell
          gnome-shell-extension-prefs
          gsettings-desktop-schemas
          libgl1-mesa-dri
          libglib2.0-bin

      # The shell version is what the extension's `metadata.json` declares support
      # for, so a runner image moving past that range fails the capture below
      # rather than silently shipping an unsupported combination. Recorded in the
      # summary, and carried into the pull request body.
      - name: Record the capture host
        run: |
          printf 'SHELL_VERSION=' >> "${GITHUB_ENV}"
          gnome-shell --version >> "${GITHUB_ENV}"
          . /etc/os-release
          {
            echo '## Capture host'
            echo
            echo '| Component | Version |'
            echo '| :--- | :--- |'
            echo "| Distribution | ${PRETTY_NAME} |"
            echo "| Kernel | $(uname -r) |"
            echo "| GNOME Shell | $(gnome-shell --version | cut -d' ' -f3) |"
            echo "| gjs | $(gjs --version 2>/dev/null || echo 'absent') |"
            echo "| Ambient \`python3\` | $(python3 --version | cut -d' ' -f2) |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      # One session bus for the whole capture: the driver spawns the shell on it,
      # and talks to it over the same bus. The shell runs on the headless backend,
      # which needs no display server of its own; should a runner image ever fail
      # to bring it up, the fallback is a nested session under `xvfb-run`.
      - name: Capture the menus
        run: >
          dbus-run-session --
          python3 docs/gnome_screenshots_update.py --workspace "${RUNNER_TEMP}/capture"

      # The per-shot shell logs are the only diagnosis a failed capture leaves,
      # and a headless GNOME fails in ways no exit code explains.
      - name: Upload the session logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnome-capture-logs
          path: ${{ runner.temp }}/capture/*.log
          if-no-files-found: warn

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pin what CI downloads: unpinned, setup-uv installs the newest uv
          # satisfying `required-version`. `sync-workflow-pins` bumps it once a
          # uv release clears the cooldown window.
          version: "0.12.1"

      # The oxipng `format-images` provisions, keyed on the file carrying the
      # repomatic pin that decides its version: a bump misses the cache once and
      # repopulates it, and a stale hit is re-verified against the registry
      # checksum rather than trusted.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-oxipng-${{
            hashFiles('.github/workflows/docs-screenshots.yaml') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-oxipng-

      # Literally the command the autofix lane runs, rather than the binary it
      # drives: `run oxipng` is a passthrough, so reaching for it means restating
      # repomatic's optimization level, strip mode and savings thresholds here,
      # where the next upstream change to any of them would go unnoticed and
      # leave `format-images` rewriting these files right back, one pull request
      # per capture. It discovers images repo-wide and rewrites only what clears
      # its own threshold, so the already-optimized rest of the tree is a no-op.
      - name: Optimize the captures
        run: |
          set -euo pipefail
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.13.0' \
            format-images | tee --append "${GITHUB_STEP_SUMMARY}"

      # One call for what three steps did by hand. It opens the pull request when
      # the captures moved, refreshes it when they move again, does nothing at all
      # when they match what is already on the branch, and closes it, branch and
      # all, once a change is reverted: that last state is the one a hand-rolled
      # upsert never handled, leaving a stale PR open forever. The branch name and
      # the label come from the template, so no step repeats them. `--add-path` is
      # a git pathspec, quoted so git expands it rather than the shell, and one
      # matching nothing is dropped instead of fatal.
      - name: Sync pull request
        env:
          # The PAT when the repository has one, so the PR it opens triggers the
          # checks a `GITHUB_TOKEN`-authored one never would.
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.13.0'
          pr-sync --template-file .github/pr-templates/update-gnome-screenshots.md
          --template-arg shell_version="${SHELL_VERSION}"
          --add-path 'docs/assets/gnome-shell-*.png'

  # The macOS half, and the one I first called impossible: these runners disable
  # SIP, run a full Aqua session, and ship screen-recording and accessibility
  # already granted, so a real SwiftBar can be installed, driven and photographed
  # with no TCC manipulation of any kind. What the images cost is resolution:
  # every mode the virtual display offers has a backing store equal to its
  # logical size, so these are 1x where the GNOME captures are 2x.
  update-bar-plugin-screenshots:
    name: Capture the SwiftBar/Xbar plugin menu
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    # Sixteen captures across two hosts and both appearances, each restarting
    # its host so a system appearance change reaches the menu.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pin what CI downloads: unpinned, setup-uv installs the newest uv
          # satisfying `required-version`. `sync-workflow-pins` bumps it once a
          # uv release clears the cooldown window.
          version: "0.12.1"

      # The driver renders the menu through `BarPluginRenderer`, so it needs the
      # package and its dependencies rather than a bare interpreter.
      - name: Install project
        run: uv --no-progress sync --frozen --all-extras --all-groups

      - name: Capture the menus
        run: >
          uv --no-progress run --frozen -- python docs/bar_screenshots_update.py
          --diagnostics "${RUNNER_TEMP}/diagnostics"

      # The ambient `python3` is the one a SwiftBar or Xbar plugin runs under,
      # so it is the version the plugin's documented `>= 3.9` floor is about.
      # Reported rather than asserted: the page's table is only as good as what
      # a real macOS actually ships.
      - name: Record the capture host
        if: always()
        run: |
          plist=/Contents/Info.plist
          key=CFBundleShortVersionString
          macos="$(sw_vers -productVersion) ($(sw_vers -buildVersion))"
          tools="$(pkgutil --pkg-info=com.apple.pkg.CLTools_Executables |
            awk '/^version:/ {print $2}')"
          python="$(/usr/bin/python3 --version | cut -d' ' -f2)"
          swiftbar="$(defaults read "/Applications/SwiftBar.app${plist}" "${key}" \
            2>/dev/null || echo 'absent')"
          xbar="$(defaults read "/Applications/xbar.app${plist}" "${key}" \
            2>/dev/null || echo 'absent')"
          {
            echo '## Capture host'
            echo
            echo '| Component | Version |'
            echo '| :--- | :--- |'
            echo "| macOS | ${macos} |"
            echo "| Command Line Tools | ${tools} |"
            echo "| Ambient \`/usr/bin/python3\` | ${python} |"
            echo "| SwiftBar | ${swiftbar} |"
            echo "| Xbar | ${xbar} |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      # What was on screen, which is the only thing that settles a host whose
      # own process answers nothing. Uploaded whether or not the captures
      # worked: a shot that comes back wrong rather than missing leaves the job
      # green and the evidence is gone by the time anyone looks at the image.
      - name: Upload the diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bar-diagnostics
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: warn

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/repomatic/bin
          key: >-
            repomatic-${{ runner.os }}-${{ runner.arch }}-oxipng-${{
            hashFiles('.github/workflows/docs-screenshots.yaml') }}
          restore-keys: |
            repomatic-${{ runner.os }}-${{ runner.arch }}-oxipng-

      # `-a` rather than `--append`, the one place this repository's long-form
      # preference cannot hold: BSD tee has no long options, and the GNU spelling
      # aborts the pipeline the Linux job runs it through happily.
      - name: Optimize the captures
        run: |
          set -euo pipefail
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.13.0' \
            format-images | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Sync pull request
        env:
          GH_TOKEN: ${{ secrets.REPOMATIC_PAT || github.token }}
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.13.0'
          pr-sync --template-file .github/pr-templates/update-bar-plugin-screenshots.md
          --add-path 'docs/assets/swiftbar-*.png'
          --add-path 'docs/assets/xbar-*.png'
