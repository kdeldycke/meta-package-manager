---
# TEMPORARY probe workflow, to be deleted once the output of Octave's `pkg`, R's
# `Rscript` and pkgcore's `pmerge` is captured for the `octave`, `r` and `pmerge`
# managers.
# yamllint disable rule:line-length
name: 🧪 Managers probe
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/managers-probe.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  pmerge:
    name: pkgcore pmerge in a Gentoo container
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Drive pmerge
        shell: bash {0}
        run: |
          cat > /tmp/probe.sh <<'EOF'
          run() {
            printf '\n=== %s\n' "$*"
            "$@" > /tmp/out 2> /tmp/err
            printf -- '--- exit=%s\n--- stdout\n' "$?"
            head -n 80 /tmp/out
            printf -- '--- stderr\n'
            head -n 40 /tmp/err
          }
          printf 'FEATURES="${FEATURES} -ipc-sandbox -network-sandbox -pid-sandbox -sandbox -usersandbox"\n' >> /etc/portage/make.conf
          printf 'MAKEOPTS="-j4"\n' >> /etc/portage/make.conf
          emerge-webrsync --quiet > /tmp/webrsync.log 2>&1
          printf 'emerge-webrsync exit=%s\n' "$?"
          tail -n 5 /tmp/webrsync.log
          emerge --quiet --getbinpkg --oneshot sys-apps/pkgcore > /tmp/emerge.log 2>&1 \
            || emerge --quiet --oneshot sys-apps/pkgcore > /tmp/emerge.log 2>&1
          printf 'emerge pkgcore exit=%s\n' "$?"
          tail -n 5 /tmp/emerge.log
          INSTALLED='{category}/{package}={fullver}'
          SLOTTED='{category}/{package}:{slot}={fullver}'
          SEARCH='{category}/{package}={fullver}={description}'

          run cat /usr/share/portage/config/repos.conf
          run pmerge --version
          run pmerge --color no --version
          run pquery --color no --installed --format "$INSTALLED"
          run pquery --color no --installed --format "$SLOTTED"
          run pmerge --color no --list-sets
          run pmerge --color no --pretend --upgrade --deep --newuse @world @system
          run pmerge --color no games-misc/nyancat
          run pmerge --color no --oneshot dev-libs/libevent
          printf 'sys-apps/pkgcore\n' >> /var/lib/portage/world
          run cat /var/lib/portage/world
          run pmerge --color no --pretend --clean
          run pquery --color no --installed --format "$INSTALLED" nyancat libevent pkgcore

          run pquery --color no --max --format "$SEARCH" '*nyan*'
          run pquery --color no --max --format "$SEARCH" nyancat
          run pquery --color no --max --format "$SEARCH" --description 'ANSI escape'
          run pquery --color no --max --format "$SEARCH" '*cowsay*'
          run bash -c "time pquery --color no --max --format '$SEARCH' '*py*' | wc -l"
          run bash -c "time pquery --color no --max --format '$SEARCH' --description 'terminal' | wc -l"

          printf 'ACCEPT_KEYWORDS="~amd64"\n' >> /etc/portage/make.conf
          run pquery --color no --upgrade --format "$SLOTTED"
          run pquery --color no --installed --format "$SLOTTED"
          run bash -c "time pquery --color no --upgrade --format '$SLOTTED' | wc -l"
          run pmerge --color no --pretend --upgrade --deep --newuse @world @system
          run pmerge --color no --pretend --upgrade app-crypt/libmd
          run pmerge --color no --upgrade app-crypt/libmd
          run pquery --color no --installed --format "$SLOTTED" libmd
          run cat /var/lib/portage/world

          run pmerge --color no --clean
          run pquery --color no --installed --format "$INSTALLED" libevent
          run pmerge --color no --unmerge games-misc/nyancat
          run pclean --color no dist --installed --pretend
          run pclean --color no dist --installed
          run ls /var/cache/distfiles
          run timeout 900 pmaint --color no sync
          run timeout 900 pmaint --color no sync gentoo
          EOF
          docker run --rm --privileged --volume /tmp/probe.sh:/probe.sh:ro \
            'gentoo/stage3:amd64-openrc-20261102@sha256:dcf796a992c7b1a507c9c564bd11faf9b3a39bea0b4474ef64240cd6554dc691' \
            bash /probe.sh
