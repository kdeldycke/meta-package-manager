---
# TEMPORARY probe workflow, to be deleted once the output of Octave's `pkg`, R's
# `Rscript` and pkgcore's `pmerge` is captured for the `octave`, `cran` and
# `pmerge` managers.
# yamllint disable rule:line-length
name: 🧪 Managers probe
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/managers-probe.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  octave-cran:
    name: mpm driving Octave and R on Ubuntu
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Install Octave and R
        run: |
          sudo apt-get --quiet update
          sudo apt-get --quiet --yes install --no-install-recommends octave r-base-core
          # A dated Posit Package Manager snapshot of CRAN, seven days old: the
          # cooldown for the installs below, which CRAN itself cannot express.
          printf 'options(repos = c(CRAN = "https://packagemanager.posit.co/cran/2026-10-31"))\n' | sudo tee --append /etc/R/Rprofile.site
      - name: Install mpm
        run: uv --no-progress sync --frozen
      - name: Drive mpm
        shell: bash {0}
        run: |
          run() {
            printf '\n=== %s\n' "$*"
            "$@" > /tmp/out 2> /tmp/err
            printf -- '--- exit=%s\n--- stdout\n' "$?"
            cat /tmp/out
            printf -- '--- stderr\n'
            cat /tmp/err
          }
          MPM=(uv --no-progress run --frozen -- mpm --verbosity INFO)
          OLD_DOCTEST='https://downloads.sourceforge.net/project/octave/Octave%20Forge%20Packages/Individual%20Package%20Releases/doctest-0.8.1.tar.gz'
          OLD_R6='https://cran.r-project.org/src/contrib/Archive/R6/R6_2.5.1.tar.gz'

          run "${MPM[@]}" --octave --cran managers
          run "${MPM[@]}" --octave installed
          run "${MPM[@]}" --octave search doc
          run "${MPM[@]}" --octave search --exact doctest
          run "${MPM[@]}" --octave install doctest
          run "${MPM[@]}" --octave installed
          run "${MPM[@]}" --octave remove doctest
          run octave-cli --no-init-file --quiet --no-window-system --eval "pkg install \"$OLD_DOCTEST\""
          run "${MPM[@]}" --octave outdated
          run "${MPM[@]}" --octave upgrade doctest
          run "${MPM[@]}" --octave outdated
          run octave-cli --no-init-file --quiet --no-window-system --eval "pkg uninstall doctest; pkg install \"$OLD_DOCTEST\""
          run "${MPM[@]}" --octave upgrade --all
          run "${MPM[@]}" --octave installed
          run "${MPM[@]}" --octave remove doctest
          run "${MPM[@]}" --octave remove doctest

          run "${MPM[@]}" --cran installed
          run "${MPM[@]}" --cran outdated
          run "${MPM[@]}" --cran search praise
          run "${MPM[@]}" --cran search --exact praise
          run "${MPM[@]}" --cran install praise
          run "${MPM[@]}" --cran installed
          run Rscript --no-init-file -e "install.packages('$OLD_R6', repos = NULL, type = 'source', lib = .libPaths()[1L])"
          run "${MPM[@]}" --cran outdated
          run "${MPM[@]}" --cran upgrade R6
          run "${MPM[@]}" --cran outdated
          run Rscript --no-init-file -e "install.packages('$OLD_R6', repos = NULL, type = 'source', lib = .libPaths()[1L])"
          run "${MPM[@]}" --cran upgrade --all
          run "${MPM[@]}" --cran installed
          run "${MPM[@]}" --cran remove praise
          run "${MPM[@]}" --cran remove praise
          run "${MPM[@]}" --cran install nosuchpackage

          run uv --no-progress run --frozen -- pytest tests/test_cli_install_remove.py tests/test_cli_upgrade.py --run-destructive --numprocesses=0 --no-cov -p no:randomly -k 'octave or cran'

  pmerge:
    name: mpm driving pmerge in a Gentoo container
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - name: Drive mpm
        shell: bash {0}
        run: |
          cat > /tmp/probe.sh <<'EOF'
          run() {
            printf '\n=== %s\n' "$*"
            "$@" > /tmp/out 2> /tmp/err
            printf -- '--- exit=%s\n--- stdout\n' "$?"
            head -n 80 /tmp/out
            printf -- '--- stderr\n'
            head -n 60 /tmp/err
          }
          printf 'FEATURES="${FEATURES} -ipc-sandbox -network-sandbox -pid-sandbox -sandbox -usersandbox"\n' >> /etc/portage/make.conf
          printf 'MAKEOPTS="-j4"\n' >> /etc/portage/make.conf
          emerge-webrsync --quiet > /tmp/webrsync.log 2>&1
          printf 'emerge-webrsync exit=%s\n' "$?"
          emerge --quiet --getbinpkg --oneshot sys-apps/pkgcore > /tmp/emerge.log 2>&1 \
            || emerge --quiet --oneshot sys-apps/pkgcore > /tmp/emerge.log 2>&1
          printf 'emerge pkgcore exit=%s\n' "$?"
          printf 'sys-apps/pkgcore\n' >> /var/lib/portage/world
          run ls -ld /var/cache/distfiles
          run ls -l /var/cache/distfiles
          chown -R portage:portage /var/cache/distfiles
          run ls -ld /var/cache/distfiles

          cp -a /src /tmp/src
          cd /tmp/src || exit 1
          uv --no-progress sync --frozen --python /usr/bin/python3 > /tmp/sync.log 2>&1
          printf 'uv sync exit=%s\n' "$?"
          tail -n 5 /tmp/sync.log
          MPM=(uv --no-progress run --frozen -- mpm --verbosity INFO)

          run "${MPM[@]}" --pmerge managers
          run "${MPM[@]}" --pmerge installed
          run "${MPM[@]}" --pmerge search nyancat
          run "${MPM[@]}" --pmerge search --exact nyancat
          run "${MPM[@]}" --pmerge search --extended 'ANSI escape'
          run "${MPM[@]}" --pmerge install games-misc/nyancat
          run "${MPM[@]}" --pmerge installed nyancat
          run cat /var/lib/portage/world
          run "${MPM[@]}" --pmerge orphans
          run "${MPM[@]}" --pmerge remove games-misc/nyancat
          run "${MPM[@]}" --pmerge remove games-misc/nyancat
          run cat /var/lib/portage/world

          printf 'ACCEPT_KEYWORDS="~amd64"\n' >> /etc/portage/make.conf
          run "${MPM[@]}" --pmerge outdated
          run "${MPM[@]}" --pmerge upgrade app-crypt/libmd
          run "${MPM[@]}" --pmerge installed libmd
          run "${MPM[@]}" --pmerge --plan upgrade --all
          run "${MPM[@]}" --pmerge sync
          run "${MPM[@]}" --pmerge cleanup
          run "${MPM[@]}" --pmerge cleanup --orphans
          run "${MPM[@]}" --pmerge orphans
          EOF
          docker run --rm --privileged \
            --env UV_EXCLUDE_NEWER --env NO_COLOR=1 \
            --volume /tmp/probe.sh:/probe.sh:ro \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$(command -v uv):/usr/local/bin/uv:ro" \
            'gentoo/stage3:amd64-openrc-20261102@sha256:dcf796a992c7b1a507c9c564bd11faf9b3a39bea0b4474ef64240cd6554dc691' \
            bash /probe.sh
