---
name: 🔬 Probe SwiftBar panels
"on":
  push:
    branches:
      - swiftbar-panels

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Temporary: exercises the new About-submenu and preferences captures of
# `docs/bar_screenshots_update.py` on a hosted macOS runner, uploading the
# frames and the diagnostics as artifacts instead of opening a pull request.
# Retired once the captures converge and land in `docs-screenshots.yaml`.

env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  probe:
    name: Capture ${{ matrix.subject }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        subject:
          - about
          - preferences
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Install project
        run: uv --no-progress sync --frozen --all-extras --all-groups

      - name: Capture the frames
        env:
          MPM_CAPTURE_SCREENS: "1"
        run: >
          uv --no-progress run --frozen -- python docs/bar_screenshots_update.py
          --only 'swiftbar-${{ matrix.subject }}-*'
          --diagnostics "${RUNNER_TEMP}/diagnostics"

      - name: Record the capture host
        if: always()
        run: |
          {
            echo '## Capture host'
            echo
            echo "- macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion))"
            echo "- Ambient python3 $(/usr/bin/python3 --version | cut -d' ' -f2)"
            echo "- /usr/local/bin: $(stat -f '%Su:%Sg %Sp' /usr/local/bin)"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload the frames
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swiftbar-${{ matrix.subject }}-frames
          path: docs/assets/swiftbar-*.png
          if-no-files-found: warn

      - name: Upload the diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swiftbar-${{ matrix.subject }}-diagnostics
          path: ${{ runner.temp }}/diagnostics
          if-no-files-found: warn
