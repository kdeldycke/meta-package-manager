---
name: 🚀 Build & release
"on":
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "43 0 * * 1"

permissions: {}

concurrency:
  # Declared on this push-triggered entry, not the reusable _release-engine.yaml it
  # calls: GitHub decides run cancellation from the entry workflow's group, and a
  # block on the engine lane (reached via `needs: build`) joins its group too late
  # to cancel queued or building runs. Regular commits share a per-branch group and
  # cancel each other; release commits ([changelog] Release / Post-release) get a
  # unique SHA-based group so an in-flight release is never cancelled by a later push.
  # Scheduled and manually dispatched runs get a run-scoped group: they build the
  # full target fleet on purpose, so neither a later push nor another run should
  # cancel them (a dispatch sharing the branch group was observed cancelled mid-build
  # by the next push), and they never cancel a push run either.
  group: >-
    ${{ github.workflow }}-${{
      (
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        && github.run_id
      )
      || github.event.pull_request.number
      || (
        (startsWith(github.event.head_commit.message, '[changelog] Release')
        || startsWith(github.event.head_commit.message, '[changelog] Post-release'))
        && github.sha
      )
      || github.ref
    }}
  cancel-in-progress: true

# Supply-chain cooldown: no package published within the window can be resolved by
# any command in this workflow. Set here, not per command, so it also covers the
# `metadata` bootstrap and any step added later; a workflow-level `env:` cannot
# reference `needs`, so the window is a literal kept equal to `[tool.repomatic]
# minimum-release-age`. repomatic's own test suite enforces that upstream; a
# synced copy is kept in step by hand. Deliberate bypasses are per-package CLI
# flags (`--exclude-newer-package`, `--min-release-age-exclude`).
# See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  build:
    uses: kdeldycke/repomatic/.github/workflows/_release-build.yaml@ab43527b67361553b1c8539e8f3d9e6e2013b98c # v7.8.0
    permissions:
      id-token: write
      issues: write

  publish-pypi:
    name: 🐍 Publish to PyPI (${{ matrix.short_sha }})
    needs: build
    # Gate decoupled from the run's overall result: always() lets this job run even when an unrelated job (like binary
    # tests in the engine lane) failed the run, and package_built confirms the wheel actually built, so a cleanly-built
    # wheel still publishes. Both signals come from the build lane (_release-build.yaml).
    if: >-
      always()
      && needs.build.outputs.package_built == 'true'
      && needs.build.outputs.release_commits_matrix
    strategy:
      # GitHub evaluates `strategy.matrix` during job setup even when `if:` will skip the job. On a non-release push
      # the build lane emits an empty string for `release_commits_matrix` (not "null": see its output description for
      # why). A bare `fromJSON('')` aborts the whole run with "Unexpected value ''", so we fall back to an empty
      # `{"include":[]}` matrix, which expands the job to zero runs and skips it cleanly.
      matrix: ${{ fromJSON(needs.build.outputs.release_commits_matrix || '{"include":[]}') }}
    runs-on: ubuntu-slim
    permissions:
      # OIDC only: the PyPI Trusted Publishing token. The GitHub release notes
      # (with their PyPI admonition) are owned end to end by the engine lane's
      # create-release job, so this lane needs no write access to the repo.
      id-token: write
    steps:
      - uses: kdeldycke/repomatic/.github/actions/publish-pypi@ab43527b67361553b1c8539e8f3d9e6e2013b98c # v7.8.0
        with:
          artifact-name: ${{ github.event.repository.name }}-${{ matrix.short_sha }}

  release:
    uses: kdeldycke/repomatic/.github/workflows/_release-engine.yaml@ab43527b67361553b1c8539e8f3d9e6e2013b98c # v7.8.0
    needs:
      - build
      - build-gnome-extension
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      REPOMATIC_PAT: ${{ secrets.REPOMATIC_PAT }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  # Pack the GNOME Shell extension and hand it to the release engine's extra-assets
  # job as a `release-asset-*` run artifact (see `release-assets` in [tool.repomatic]).
  # Unconditional like the build lane: `release` needs this job, and a skip here
  # would cascade into skipping the whole engine on regular pushes.
  # Placed after the `release` caller on purpose: `repomatic init` treats the last
  # job referencing the upstream repo as the boundary and discards anything above it,
  # so a downstream job declared earlier in the file is silently dropped on every sync.
  # The pack invocation below is duplicated from the `pack` job of
  # tests-gnome-extension.yaml, which round-trips the same zip through
  # `gnome-extensions install`. Keep the `--extra-source` whitelist identical in
  # both, or the released artifact stops being the one that was tested.
  build-gnome-extension:
    name: 🐚 Pack GNOME Shell extension
    runs-on: ubuntu-24.04
    permissions:
      # Checkout only. The packed zip leaves as a run artifact, which rides the
      # Actions runtime token and needs no scope of its own.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The gnome-extensions CLI lives in the gnome-shell package; skipping the
      # recommends keeps the desktop stack out of the runner.
      - name: Install gnome-extensions CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnome-shell
      # The canonical packer: validates metadata.json, compiles the schemas, and
      # packs from an explicit file whitelist so stray files never leak into the
      # zip. Non-standard files must be declared via --extra-source.
      - name: Pack the extension
        run: >
          gnome-extensions pack --force
          --extra-source=mpm.js
          --extra-source=icons
          --out-dir "$RUNNER_TEMP"
          "gnome-shell/mpm@kdeldycke.github.io"
      - name: Rename to the release asset name
        run: >
          mv "$RUNNER_TEMP/mpm@kdeldycke.github.io.shell-extension.zip"
          "$RUNNER_TEMP/mpm-gnome-shell-extension.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-asset-mpm-gnome-shell-extension.zip
          path: ${{ runner.temp }}/mpm-gnome-shell-extension.zip

  # Prepare a Guix package definition after the release job. Unlike Homebrew, Scoop,
  # NixOS, and AUR, the Guix definition is maintained in this repo (see packaging/guix/).
  # Guix packages live on Codeberg and require reviewed PRs, so this job only updates the
  # local definition and opens a PR.
  guix:
    name: 🐂 Guix
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the redundant-PR check can compute the merge base
          # between main and the open release branch (see the reconcile step below).
          fetch-depth: 0
      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Authenticated lookup: anonymous api.github.com calls from shared runner IPs trip the rate limit.
          latest=$(
            gh api repos/kdeldycke/meta-package-manager/releases/latest \
              --jq '.tag_name | ltrimstr("v")'
          )
          current=$(
            grep --only-matching --perl-regexp '\(version "\K[^"]+' \
              packaging/guix/meta-package-manager.scm
          )
          # Number of an already-open PR on the release branch, empty when none.
          existing=$(
            gh pr list --head guix/release --state open --json number \
              --jq '.[0].number'
          )
          {
            echo "version=${latest}"
            echo "existing=${existing}"
          } >> "${GITHUB_OUTPUT}"
          if [ "${latest}" = "${current}" ]; then
            echo "Definition already at ${latest}; no version bump needed."
            echo "needs_update=false" >> "${GITHUB_OUTPUT}"
          else
            echo "New release found: ${latest} (definition has ${current})."
            echo "needs_update=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Update package definition to latest release
        if: steps.check.outputs.needs_update == 'true'
        run: python3 packaging/guix/update.py
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.check.outputs.needs_update == 'true'
        with:
          # Pin what CI downloads: unpinned, setup-uv installs the newest uv
          # satisfying `required-version`, leaving the tool that enforces every
          # cooldown installed without one. `sync-workflow-pins` walks it forward
          # once a uv release clears the window.
          version: "0.12.1"
      - name: Render PR body
        if: steps.check.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.8.0' pr-body
          --template-file .github/pr-templates/update-package-spec.md
          --template-arg channel=Guix
          --template-arg version="${VERSION}"
          --template-arg spec_path=packaging/guix/
          --output body.md
      - name: Open PR with updated packaging files
        if: steps.check.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="guix/release"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add --update packaging/guix/
          git commit --message "Update Guix package definition to v${VERSION}"
          git push --force --set-upstream origin "${branch}"
          existing=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number')
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" \
              --title "Update Guix package definition to v${VERSION}" \
              --body-file body.md \
              --add-label "📦 manager: guix"
          else
            gh pr create \
              --title "Update Guix package definition to v${VERSION}" \
              --body-file body.md \
              --label "📦 manager: guix"
          fi
      # Reconcile an already-open release PR that a direct commit (or an earlier
      # merge) has made redundant: main already carries the latest release, so the
      # PR would change nothing. Close it, but only after proving the merge is a
      # genuine no-op, so a still-pending PR is never discarded.
      - name: Close the release PR when it became redundant
        if: steps.check.outputs.needs_update != 'true' && steps.check.outputs.existing != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING: ${{ steps.check.outputs.existing }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          branch="guix/release"
          git fetch --no-tags origin "${branch}"
          # Merge the PR branch into main in memory: an identical resulting tree
          # means merging changes nothing, so the PR is redundant. A non-zero exit
          # means the merge conflicts, so leave the PR for manual review.
          if merged=$(git merge-tree --write-tree HEAD FETCH_HEAD) \
            && [ "${merged}" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            msg="Superseded: \`main\` already matches \`v${VERSION}\`, so merging this would change nothing."
            gh pr close "${EXISTING}" --delete-branch --comment "${msg}"
          else
            echo "PR #${EXISTING} still carries changes not on main; leaving it open."
          fi

  # Prepare a Nix package definition after the release job. Unlike Homebrew, Scoop,
  # and AUR, the Nix definition is maintained in this repo (see packaging/nix/) while
  # NixOS/nixpkgs#506145 is pending review. This job only updates the local definition
  # and opens a PR.
  nix:
    name: ❄️ Nix
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the redundant-PR check can compute the merge base
          # between main and the open release branch (see the reconcile step below).
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Check for new release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Authenticated lookup: anonymous api.github.com calls from shared runner IPs trip the rate limit.
          latest=$(
            gh api repos/kdeldycke/meta-package-manager/releases/latest \
              --jq '.tag_name | ltrimstr("v")'
          )
          current=$(
            grep --only-matching --perl-regexp 'version = "\K[^"]+' \
              packaging/nix/package.nix \
            | head --lines=1
          )
          # Number of an already-open PR on the release branch, empty when none.
          existing=$(
            gh pr list --head nix/release --state open --json number \
              --jq '.[0].number'
          )
          {
            echo "version=${latest}"
            echo "existing=${existing}"
          } >> "${GITHUB_OUTPUT}"
          if [ "${latest}" = "${current}" ]; then
            echo "Definition already at ${latest}; no version bump needed."
            echo "needs_update=false" >> "${GITHUB_OUTPUT}"
          else
            echo "New release found: ${latest} (definition has ${current})."
            echo "needs_update=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Update package definition to latest release
        if: steps.check.outputs.needs_update == 'true'
        run: python3 packaging/nix/update.py
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: steps.check.outputs.needs_update == 'true'
        with:
          # Pin what CI downloads: unpinned, setup-uv installs the newest uv
          # satisfying `required-version`, leaving the tool that enforces every
          # cooldown installed without one. `sync-workflow-pins` walks it forward
          # once a uv release clears the window.
          version: "0.12.1"
      - name: Render PR body
        if: steps.check.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: >
          uvx --no-progress --exclude-newer-package repomatic=P0D 'repomatic==7.8.0' pr-body
          --template-file .github/pr-templates/update-package-spec.md
          --template-arg channel=Nix
          --template-arg version="${VERSION}"
          --template-arg spec_path=packaging/nix/
          --output body.md
      - name: Open PR with updated packaging files
        if: steps.check.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="nix/release"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add --update packaging/nix/
          git commit --message "Update Nix package definition to v${VERSION}"
          git push --force --set-upstream origin "${branch}"
          existing=$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number')
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" \
              --title "Update Nix package definition to v${VERSION}" \
              --body-file body.md \
              --add-label "📦 manager: nix"
          else
            gh pr create \
              --title "Update Nix package definition to v${VERSION}" \
              --body-file body.md \
              --label "📦 manager: nix"
          fi
      # Reconcile an already-open release PR that a direct commit (or an earlier
      # merge) has made redundant: main already carries the latest release, so the
      # PR would change nothing. Close it, but only after proving the merge is a
      # genuine no-op, so a still-pending PR is never discarded.
      - name: Close the release PR when it became redundant
        if: steps.check.outputs.needs_update != 'true' && steps.check.outputs.existing != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING: ${{ steps.check.outputs.existing }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          branch="nix/release"
          git fetch --no-tags origin "${branch}"
          # Merge the PR branch into main in memory: an identical resulting tree
          # means merging changes nothing, so the PR is redundant. A non-zero exit
          # means the merge conflicts, so leave the PR for manual review.
          if merged=$(git merge-tree --write-tree HEAD FETCH_HEAD) \
            && [ "${merged}" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            msg="Superseded: \`main\` already matches \`v${VERSION}\`, so merging this would change nothing."
            gh pr close "${EXISTING}" --delete-branch --comment "${msg}"
          else
            echo "PR #${EXISTING} still carries changes not on main; leaving it open."
          fi
