---
# TEMPORARY probe workflow, to be deleted once the dormant-marker hint is
# verified. It manufactures the real failures the hint exists for: a global
# npm install into a root-owned prefix, and a gem install into a system Ruby.
name: 🧪 sudo hint probe
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sudo-hint-probe.yaml
      - meta_package_manager/execution.py
      - meta_package_manager/sudo.py

env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  hint:
    name: dormant-marker hint on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Install mpm
        run: uv sync --no-progress --all-extras --all-groups

      - name: Point npm at a root-owned prefix
        run: |
          sudo mkdir -p /opt/npmroot
          sudo chown root:root /opt/npmroot
          # The runner prepares /opt with setgid, sticky and a permissive ACL,
          # which children inherit: strip all of it or anyone can write.
          sudo chmod 0755 /opt/npmroot
          sudo setfacl -b /opt/npmroot
          npm config set prefix /opt/npmroot
          npm config get prefix
          ls -ld /opt/npmroot

      - name: Assert the hint on a dormant npm permission failure
        run: |
          uv run --no-progress --frozen -- mpm --verbosity INFO --npm \
            install cowsay > out.txt 2>&1 || true
          tail -25 out.txt
          grep -q "marked privileged" out.txt
          grep -q -- "mpm --npm --sudo" out.txt
          grep -q "\[mpm.managers.npm\] sudo = true" out.txt

      # The escalated npm resolves root's own config (sudo resets HOME), so the
      # package lands under root's default prefix, not the runner's: asserted
      # through the escalated npm's own listing rather than a hardcoded path.
      - name: Assert the named remedy actually works
        run: |
          uv run --no-progress --frozen -- mpm --verbosity INFO --npm --sudo \
            install cowsay 2>&1 | tail -15
          sudo npm ls --global --depth=0 | grep cowsay

      - name: Assert no hint on an unrelated npm failure
        run: |
          uv run --no-progress --frozen -- mpm --verbosity INFO --npm \
            install this-package-does-not-exist-mpm-probe > out2.txt 2>&1 || true
          tail -15 out2.txt
          if grep -q "marked privileged" out2.txt; then
            echo "hint fired on a non-permission failure"; exit 1
          fi

      # Health findings from `npm doctor` and `pip check` are expected on a
      # runner and irrelevant here: the gates only read the ownership lines.
      - name: Assert doctor reports install roots and owners
        run: |
          uv run --no-progress --frozen -- mpm --verbosity INFO --npm --pip \
            doctor > doc.txt 2>&1 || true
          cat doc.txt
          grep -q "Install root: /opt/npmroot (owned by root)" doc.txt
          grep -qE "Install root: .+packages \(owned by [a-z]" doc.txt

      # Report-only: whether the runner's system Ruby reproduces the gem
      # wording depends on the image's ownership of the gem dir.
      - name: Report the gem wording, if the image can produce it
        shell: bash {0}
        run: |
          gem environment gemdir
          ls -ld "$(gem environment gemdir)" || true
          uv run --no-progress --frozen -- mpm --verbosity INFO --gem \
            install hola > out3.txt 2>&1 || true
          tail -20 out3.txt
          grep -c "marked privileged" out3.txt || true
