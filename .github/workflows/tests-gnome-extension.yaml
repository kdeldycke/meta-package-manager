---
name: 🐚 Test GNOME Shell extension
"on":
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/tests-gnome-extension.yaml
      - gnome-shell/**
      - tests/gnome/**
      - tests/test_gnome_extension.py
  pull_request:
    paths:
      - .github/workflows/tests-gnome-extension.yaml
      - gnome-shell/**
      - tests/gnome/**
      - tests/test_gnome_extension.py

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Exercise the GNOME Shell extension outside a GNOME session: its sources are
# held to GNOME Shell's own coding style, its shell-free mpm.js module runs
# under a bare gjs interpreter (see tests/gnome/run-tests.js for the
# rationale), and the GSettings schema compiles with the same strict checks
# `gnome-extensions install` applies. The static invariants
# (tests/test_gnome_extension.py) are `once`-marked and need no job here: the
# `once-tests` job of tests.yaml is their single executor.
# Visual QA needs a real GNOME session and stays manual: install the zip
# artifact packed below with `gnome-extensions install --force <zip>`.

# Supply-chain cooldown: no package published within the window can be resolved
# by any command in this workflow. Set here, not per command, so it also covers
# the `npx` invocation below and any step added later; the explicit
# `--min-release-age` on the install step is kept as documentation of what the
# floating stack is gated on. Held equal to `[tool.repomatic]
# minimum-release-age`. See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  eslint:
    name: Lint JavaScript
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No package.json or lockfile backs this: nobody would keep one
      # refreshed, so the stack floats and --min-release-age gates the whole
      # resolved tree, transitive dependencies included, on 7 days of public
      # exposure. That is the same supply-chain guard mpm's own --cooldown
      # applies to the packages it installs. The ruleset itself is a git
      # dependency with no npmjs release, pinned to the commit gnome-shell
      # pins in its own tools/package.json: a release-age window cannot gate a
      # git reference, and a frozen style ruleset ages harmlessly.
      - name: Install ESLint and GNOME Shell's ruleset
        run: > # zizmor: ignore[adhoc-packages]
          npm install --no-save --no-package-lock --no-audit --no-fund
          --min-release-age=7
          eslint
          "git+https://gitlab.gnome.org/World/javascript/eslint-config-gnome.git#c479d059e8d9ea99c3b53c2ea43abf7fdb05eb51"
      # ESLint runs from the repository root, which is what the config
      # resolves its file globs against. Naming both directories explicitly
      # keeps it off the rest of the tree.
      - name: Run ESLint
        run: >
          npx eslint --config gnome-shell/eslint.config.mjs
          gnome-shell tests/gnome

  gjs-tests:
    name: gjs unit suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install gjs and GLib tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes gjs libglib2.0-bin
      - name: Validate GSettings schema
        run: >
          glib-compile-schemas --strict --dry-run
          "gnome-shell/mpm@kdeldycke.github.io/schemas/"
      - name: Run gjs unit suite
        run: gjs -m tests/gnome/run-tests.js

  # Mirrors the `build-gnome-extension` job of release.yaml, which packs the zip
  # attached to every release: the `--extra-source` whitelist must stay identical
  # in both, or this job stops testing the artifact users download.
  pack:
    name: Pack installable zip
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The gnome-extensions CLI lives in the gnome-shell package; skipping the
      # recommends keeps the desktop stack out of the runner.
      - name: Install gnome-extensions CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gnome-shell
      # The canonical packer: validates metadata.json, compiles the schemas, and
      # packs from an explicit file whitelist so stray files never leak into the
      # zip. Non-standard files must be declared via --extra-source.
      - name: Pack the extension
        run: >
          gnome-extensions pack --force
          --extra-source=mpm.js
          --extra-source=icons
          --out-dir "$RUNNER_TEMP"
          "gnome-shell/mpm@kdeldycke.github.io"
      # Round-trip: consume the zip with the same command users run, proving
      # the packed layout installs as-is. Purely file-based, no session needed.
      - name: Install round-trip
        run: >
          gnome-extensions install --force
          "$RUNNER_TEMP/mpm@kdeldycke.github.io.shell-extension.zip" &&
          test -f "$HOME/.local/share/gnome-shell/extensions/mpm@kdeldycke.github.io/metadata.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnome-shell-extension
          path: ${{ runner.temp }}/mpm@kdeldycke.github.io.shell-extension.zip
