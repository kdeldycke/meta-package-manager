---
name: 🏪 Test distributors
"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/tests-install.yaml
      - packaging/alpine/**
      - packaging/choco/**
      - packaging/guix/**
      - packaging/macports/**
      - packaging/nix/**
  pull_request:
    paths:
      - .github/workflows/tests-install.yaml
      - packaging/alpine/**
      - packaging/choco/**
      - packaging/guix/**
      - packaging/macports/**
      - packaging/nix/**
  workflow_dispatch:
  schedule:
    # Run weekly to catch regressions from packaging or distribution changes.
    - cron: "17 9 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Test that mpm is installable from each distribution channel. Most jobs
# install the released artifact from external feeds (PyPI, Homebrew, Scoop,
# GitHub Releases, etc.). The `*-source` jobs install from the in-repo
# packaging specs (packaging/alpine/, packaging/choco/, packaging/guix/,
# packaging/macports/, packaging/nix/) and validate the build instructions
# documented in docs/packaging.md.
#
# Keep in sync with the "Installation methods" tabs in docs/install.md and
# the per-channel catalog and build instructions in docs/packaging.md.

# The one workflow that opts out of the supply-chain cooldown every other
# workflow sets, by declaring a zero-length window. Its subject IS the freshly
# published artifact: it answers "does the release that shipped install and
# run from each channel?", which a cooldown makes unanswerable, since neither a
# new release nor a dependency floor raised to a recent version can resolve
# until the window elapses. Declared here rather than left to uv's default so
# the opt-out reads as a decision. Safe to scope this wide: every job inherits
# `permissions: {}`, takes no secrets, and only runs `--version` on a throwaway
# runner. The distro-archive jobs (apk, macports, nix, choco) are unaffected
# either way, their archives staging releases on their own. See claude.md
# § Cooldown on every install.
env:
  UV_EXCLUDE_NEWER: P0D

jobs:

  # https://github.com/kdeldycke/meta-package-manager/tree/main/packaging/alpine
  # https://gitlab.alpinelinux.org/alpine/aports/-/merge_requests/105566
  # Build and install from the in-repo APKBUILD overlay while the aports merge
  # request above is pending review: meta-package-manager plus the dependency
  # packages missing from the official aports tree
  # (py3-click-extra, py3-cloup, py3-extra-platforms, py3-packageurl).
  # Targets Alpine edge, the only branch shipping py3-uv-build (mpm's build
  # backend) and py3-boltons >= 25. Packages are built in dependency order:
  # abuild resolves the previously-built ones from the local ~/packages
  # repository, whose signing key is trusted system-wide by the keygen step.
  apk-source:
    name: "✅ apk-source"
    runs-on: ubuntu-26.04
    container:
      image: alpine:edge
    env:
      # Stamped into the signing key name and the built packages' metadata.
      PACKAGER: "Kevin Deldycke <kevin@deldycke.com>"
    steps:
      - name: Install build tooling
        run: apk add --no-cache alpine-sdk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure abuild
        # abuild-keygen --append registers the private key in abuild.conf; the
        # public half is copied by hand, as --install shells out to doas,
        # which the container does not have. REPODEST is pinned in the user
        # conf (sourced last) because its default follows abuild's XDG
        # migrations (~/packages, now ~/.local/share/abuild) and the install
        # step below must know the path.
        run: |
          abuild-keygen --append -n
          cp "$HOME"/.config/abuild/*.rsa.pub /etc/apk/keys/
          echo "REPODEST=$HOME/packages" >> "$HOME"/.config/abuild/abuild.conf
      # abuild has no long-form options: -F builds as the container's root
      # user, -r installs missing build dependencies.
      - name: Build py3-cloup
        working-directory: packaging/alpine/py3-cloup
        run: abuild -F -r
      - name: Build py3-extra-platforms
        working-directory: packaging/alpine/py3-extra-platforms
        run: abuild -F -r
      - name: Build py3-packageurl
        working-directory: packaging/alpine/py3-packageurl
        run: abuild -F -r
      - name: Build py3-click-extra
        working-directory: packaging/alpine/py3-click-extra
        run: abuild -F -r
      - name: Build meta-package-manager
        working-directory: packaging/alpine/meta-package-manager
        run: abuild -F -r
      - name: Install mpm
        run: apk add --repository "$HOME/packages/alpine" meta-package-manager
      - run: mpm --version

  # https://formulae.brew.sh/formula/meta-package-manager
  # https://github.com/Homebrew/homebrew-core/blob/main/Formula/m/meta-package-manager.rb
  #
  # OS matrix tracks brew's own support floor, set by the
  # `6.0.0 <https://brew.sh/2026/06/11/homebrew-6.0.0/>`_ release:
  # - Linux: Ubuntu 24.04+ (`brew/pull/21761`). 22.04 is no longer supported
  #   upstream and the matrix carries no 22.04 entry.
  # - macOS: 15+. ``macos-26`` is the current latest GitHub runner; add
  #   ``macos-27`` (Golden Gate) once GitHub ships a runner image.
  # - Intel: ``macos-15-intel`` is the last Intel macOS runner. brew has
  #   announced upcoming Intel deprecation; drop this row when brew flips.
  brew:
    name: "✅ brew (${{ matrix.os }})"
    strategy:
      matrix:
        os:
          - ubuntu-26.04-arm
          - ubuntu-26.04
          - macos-15-intel
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - if: runner.os == 'Linux'
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin/" >> "$GITHUB_PATH"
      - run: brew install meta-package-manager
      - run: mpm --version

  # https://github.com/kdeldycke/meta-package-manager/tree/main/packaging/choco/meta-package-manager
  # Build and install from the in-repo nuspec, mirroring the documented
  # "build from the specs maintained in the repository" path. The package is
  # no longer published to the Chocolatey community repository (submission 6.4.2
  # was rejected at https://github.com/chocolatey/home/issues/395#issuecomment-4378555157
  # over Nuitka antivirus false positives), so the in-repo nuspec is the only
  # supported install route.
  choco-source:
    name: "✅ choco-source (${{ matrix.os }})"
    strategy:
      matrix:
        os:
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pack
        shell: pwsh
        working-directory: packaging/choco/meta-package-manager
        run: choco pack --output-directory .
      - name: Install
        shell: pwsh
        working-directory: packaging/choco/meta-package-manager
        run: choco install meta-package-manager --source . --yes
      - shell: pwsh
        run: mpm --version

  # https://github.com/kdeldycke/meta-package-manager/releases/latest
  # Stew has no non-interactive mode (https://github.com/marwanhawari/stew/issues/91).
  # It prompts for config path, asset selection, and binary rename. Instead of
  # fighting three interactive prompts, download the released binary directly
  # with gh and verify it runs. This validates the same artifact stew would install.
  github-release:
    name: "✅ github-release (${{ matrix.os }})"
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04-arm
            asset_pattern: meta-package-manager-*-linux-arm64.bin
          - os: ubuntu-26.04
            asset_pattern: meta-package-manager-*-linux-x64.bin
          - os: macos-15-intel
            asset_pattern: meta-package-manager-*-macos-x64.bin
          - os: macos-26
            asset_pattern: meta-package-manager-*-macos-arm64.bin
          - os: windows-11-arm
            asset_pattern: meta-package-manager-*-windows-arm64.exe
          - os: windows-2025
            asset_pattern: meta-package-manager-*-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download mpm binary
        shell: bash
        run: >
          gh release download
          --repo kdeldycke/meta-package-manager
          --pattern "${{ matrix.asset_pattern }}"
          --output mpm
          --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Make executable
        if: runner.os != 'Windows'
        run: chmod +x mpm
      - run: ./mpm --version

  # https://packages.guix.gnu.org/packages/meta-package-manager/
  # https://codeberg.org/guix/guix/src/branch/master/gnu/packages/package-management.scm
  # meta-package-manager landed in Guix upstream via
  # https://codeberg.org/guix/guix/pulls/8047 (merged into master 2026-06-28).
  # `guix pull` refreshes the local channel to a commit that ships it before
  # installing. Heavyweight (the pull can build for a while) and Linux-only, so
  # keep it continue-on-error.
  guix:
    name: ⁉️ guix
    continue-on-error: true
    runs-on: ubuntu-26.04
    steps:
      # Fetched from Codeberg, where Guix development moved: Savannah answers
      # this runner with an HTTP error (wget exit 8), which is what kept both
      # Guix jobs red. `--no-verbose` over `--quiet` so the next such failure
      # names itself instead of costing a log dig.
      - name: Install Guix
        run: >
          wget --no-verbose --output-document=guix-install.sh
          --tries=5 --retry-on-http-error=429,500,502,503,504
          https://codeberg.org/guix/guix/raw/branch/master/etc/guix-install.sh
      # `yes ''` feeds the newlines the script reads with `read -r`, which is the
      # only automation upstream supports: plain `yes` answers `y`, which it
      # rejects with "that (y) was not a return!" and warns is "likely to break
      # in future". Retried because the tarball comes from ftpmirror.gnu.org, a
      # redirector that answered 502 here, and whose URL the script hardcodes.
      - name: Run Guix installer
        run: |
          chmod +x guix-install.sh
          # `ftpmirror.gnu.org` is a redirector, and it answered 502 to this
          # runner and to a home connection alike while `ftp.gnu.org` served the
          # same tarballs. The script hardcodes the redirector with no override,
          # so rewrite it to the canonical host it redirects to. A no-op if
          # upstream ever drops the redirector, which is today's behaviour.
          sed -i 's|https://ftpmirror\.gnu\.org/gnu/guix/|https://ftp.gnu.org/gnu/guix/|g' guix-install.sh
          for attempt in 1 2 3; do
            yes '' | sudo ./guix-install.sh && exit 0
            echo "Guix installer attempt ${attempt} failed, retrying in 20s."
            sleep 20
          done
          exit 1
      - name: Refresh channel and expose the pulled guix
        run: |
          guix pull
          echo "${HOME}/.config/guix/current/bin" >> "${GITHUB_PATH}"
      - name: Install mpm and expose its profile
        run: |
          guix install meta-package-manager
          echo "${HOME}/.guix-profile/bin" >> "${GITHUB_PATH}"
      - run: mpm --version

  # https://github.com/kdeldycke/meta-package-manager/tree/main/packaging/guix
  # The Guix package definition is also maintained locally (it landed upstream
  # via https://codeberg.org/guix/guix/pulls/8047). Install from the in-repo
  # definition to validate the documented build instructions.
  # Guix is Linux-only and the official install script is heavyweight; mark
  # as continue-on-error until the setup is proven stable.
  guix-source:
    name: ⁉️ guix-source
    continue-on-error: true
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fetched from Codeberg, where Guix development moved: Savannah answers
      # this runner with an HTTP error (wget exit 8), which is what kept both
      # Guix jobs red. `--no-verbose` over `--quiet` so the next such failure
      # names itself instead of costing a log dig.
      - name: Install Guix
        run: >
          wget --no-verbose --output-document=guix-install.sh
          --tries=5 --retry-on-http-error=429,500,502,503,504
          https://codeberg.org/guix/guix/raw/branch/master/etc/guix-install.sh
      # `yes ''` feeds the newlines the script reads with `read -r`, which is the
      # only automation upstream supports: plain `yes` answers `y`, which it
      # rejects with "that (y) was not a return!" and warns is "likely to break
      # in future". Retried because the tarball comes from ftpmirror.gnu.org, a
      # redirector that answered 502 here, and whose URL the script hardcodes.
      - name: Run Guix installer
        run: |
          chmod +x guix-install.sh
          # `ftpmirror.gnu.org` is a redirector, and it answered 502 to this
          # runner and to a home connection alike while `ftp.gnu.org` served the
          # same tarballs. The script hardcodes the redirector with no override,
          # so rewrite it to the canonical host it redirects to. A no-op if
          # upstream ever drops the redirector, which is today's behaviour.
          sed -i 's|https://ftpmirror\.gnu\.org/gnu/guix/|https://ftp.gnu.org/gnu/guix/|g' guix-install.sh
          for attempt in 1 2 3; do
            yes '' | sudo ./guix-install.sh && exit 0
            echo "Guix installer attempt ${attempt} failed, retrying in 20s."
            sleep 20
          done
          exit 1
      # The installer lays down the 1.5.0 binary, whose bundled channel predates
      # `python-click-extra` and `python-extra-platforms` landing in Guix. The
      # definition below takes both from upstream, so without this pull they
      # resolve to "unbound variable" and nothing gets built.
      - name: Refresh channel and expose the pulled guix
        run: |
          guix pull
          echo "${HOME}/.config/guix/current/bin" >> "${GITHUB_PATH}"
      # Guix leaves a failed builder's log on disk and prints only its path, so
      # the job goes red saying nothing. Dump the recent ones: a break in an
      # upstream dependency can be read off ci.guix.gnu.org, but one in the
      # definition below is built nowhere else and has no log to consult.
      - name: Install mpm from the local definition
        run: |
          set -o pipefail
          guix install --load-path=./packaging/guix meta-package-manager \
            2>&1 | tee guix-install.log && exit 0
          echo "::group::Tail of the failed build logs"
          sed -n "s/.*View build log at '\(.*\)'.*/\1/p" guix-install.log \
            | while read -r log; do
                echo "===== ${log}"
                sudo zcat "${log}" | tail -60
              done
          echo "::endgroup::"
          exit 1
      - run: mpm --version

  # https://ports.macports.org/port/meta-package-manager/
  # https://github.com/macports/macports-ports/blob/master/sysutils/meta-package-manager/Portfile
  # meta-package-manager landed in the official macports-ports tree on
  # 2026-07-22 via https://github.com/macports/macports-ports/pull/33609.
  # `port sync` refreshes the ports tree bundled with the installer pkg so the
  # port resolves. The port and its whole Python dependency closure are noarch
  # (darwin_any), so the buildbot publishes a single archive that serves every
  # runner and `port install` fetches it in seconds instead of compiling from
  # source.
  macports:
    name: "✅ macports (${{ matrix.os }})"
    strategy:
      matrix:
        os:
          - macos-15-intel
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install MacPorts
        run: |
          MACOS_MAJOR="$(sw_vers -productVersion | cut -d . -f 1)"
          gh release download \
            --repo macports/macports-base \
            --pattern "MacPorts-*-${MACOS_MAJOR}-*.pkg" \
            --output macports.pkg
          sudo installer -pkg macports.pkg -target /
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          echo "/opt/local/sbin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Sync official ports tree
        run: sudo port -v sync
      - name: Install mpm
        run: sudo port -v install meta-package-manager
      - run: mpm --version

  # https://github.com/kdeldycke/meta-package-manager/tree/main/packaging/macports
  # Build and install from the in-repo Portfile overlay: a local ports tree
  # providing meta-package-manager plus its dependency ports (py-click-extra,
  # py-cloup, py-deepmerge, py-extra-platforms, py-packageurl-python) and a
  # py-boltons version bump (the official port was stuck below mpm's
  # boltons >= 25 floor). All of them landed in the official macports-ports
  # tree via https://github.com/macports/macports-ports/pull/33609; the
  # overlay is kept to validate the documented build instructions and to
  # stage version bumps ahead of their upstream submission. Listed first in
  # sources.conf, it shadows the official tree for the ports it carries.
  # MacPorts installer pkgs are built per macOS version, so the asset is
  # resolved from the runner's major version (15 -> Sequoia, 26 -> Tahoe).
  # The overlay is served from /Users/Shared because the unprivileged macports
  # build user cannot read the runner workspace under /Users/runner.
  # The macos-26 leg can run ~2 hours while MacPorts' darwin_25/arm64 binary
  # archives lag behind: without a rust/cargo/uv archive, the py-uv-build
  # dependency chain compiles the Rust toolchain from source.
  macports-source:
    name: "✅ macports-source (${{ matrix.os }})"
    strategy:
      matrix:
        os:
          - macos-15-intel
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MacPorts
        run: |
          MACOS_MAJOR="$(sw_vers -productVersion | cut -d . -f 1)"
          gh release download \
            --repo macports/macports-base \
            --pattern "MacPorts-*-${MACOS_MAJOR}-*.pkg" \
            --output macports.pkg
          sudo installer -pkg macports.pkg -target /
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          echo "/opt/local/sbin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Sync official ports tree
        run: sudo port -v sync
      - name: Register overlay ports tree
        run: |
          cp -R ./packaging/macports /Users/Shared/mpm-ports
          chmod -R a+rX /Users/Shared/mpm-ports
          portindex /Users/Shared/mpm-ports
          { echo "file:///Users/Shared/mpm-ports"; cat /opt/local/etc/macports/sources.conf; } > sources.conf
          sudo cp sources.conf /opt/local/etc/macports/sources.conf
      - name: Lint ports
        run: >
          port lint --nitpick
          meta-package-manager
          py-boltons
          py-click-extra
          py-cloup
          py-deepmerge
          py-extra-platforms
          py-packageurl-python
      - name: Install mpm
        run: sudo port -v install meta-package-manager
      - run: mpm --version

  # https://search.nixos.org/packages?query=meta-package-manager
  # https://github.com/NixOS/nixpkgs/blob/master/pkgs/by-name/me/meta-package-manager/package.nix
  # No macos-15-intel entry: nixpkgs 26.11 dropped x86_64-darwin support.
  nix:
    name: "⁉️ nix (${{ matrix.os }})"
    # Not yet accepted in nixpkgs.
    continue-on-error: true
    strategy:
      matrix:
        os:
          - ubuntu-26.04-arm
          - ubuntu-26.04
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix-env --install --attr nixpkgs.meta-package-manager
      - run: mpm --version

  # https://github.com/kdeldycke/meta-package-manager/tree/main/packaging/nix
  # Install from the in-repo Nix definition, mirroring the documented build
  # instructions while NixOS/nixpkgs#506145 is pending review.
  # No macos-15-intel entry: nixpkgs 26.11 dropped x86_64-darwin support.
  nix-source:
    name: "✅ nix-source (${{ matrix.os }})"
    strategy:
      matrix:
        os:
          - ubuntu-26.04-arm
          - ubuntu-26.04
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # Nix leaves the build sandbox off on macOS, while Hydra and
          # nixpkgs-review both build with it on. Force it so this job matches
          # what nixpkgs reviewers run: the sandbox cuts the build off from the
          # macOS resolver, so a test binding to `localhost` fails there and
          # nowhere else. Already the default on Linux.
          extra_nix_config: sandbox = true
      # Report what the override resolved to: the whole reason this job and the
      # reviewers' disagreed for months was a sandbox mode no log ever printed.
      - run: nix config show sandbox
      - run: nix-env --file ./packaging/nix --install
      - run: mpm --version
      # docs/install.md offers the flake as a second entry point into the same
      # overlay, and nothing built it: its copy of the cloup override sat
      # broken for three weeks. Costs nothing whenever the flake's nixpkgs
      # input resolves to the revision the channel above already built.
      - run: nix build --no-link --print-build-logs ./packaging/nix

  # AUR builds from source with full test suites. Upstream PKGBUILD check()
  # failures in transitive dependencies cascade to every downstream package and
  # are not fixable from this project, hence the continue-on-error below. See:
  # https://aur.archlinux.org/packages/meta-package-manager#comment-1065663
  # https://aur.archlinux.org/packages/python-boltons#comment-1065664
  # https://aur.archlinux.org/packages/python-beartype#comment-1065661
  #
  # Blocked on beartype since 2026-04. First cause was test non-idempotence,
  # tripped only when aur-install retries a layer. Fixed upstream in ee167cf294cf
  # but still unreleased: 0.22.9 predates it, 0.23.0rc0 (2026-08-08) is the first
  # artifact carrying it. https://github.com/beartype/beartype/issues/631
  #
  # Current cause is a different one, and fails on the first run: beartype 0.22.9
  # expects a bare numpy NDArray to be a PEP 585 subscripted builtin, which numpy
  # 2.5 no longer makes true, failing 12 of its tests on Python 3.14. Also fixed
  # in 0.23.0rc0, so unblocking needs stable 0.23.0 and an AUR python-beartype
  # bump. Nothing to report upstream.

  # https://aur.archlinux.org/packages/meta-package-manager
  # https://aur.archlinux.org/packages/meta-package-manager-bin
  aur:
    name: "⁉️ ${{ matrix.helper }}"
    runs-on: ubuntu-26.04
    continue-on-error: true
    strategy:
      matrix:
        include:
          - helper: pacaur
            image_tag: yay
          - helper: paru
            image_tag: paru
          - helper: yay
            image_tag: yay
    container:
      image: greyltc/archlinux-aur:${{ matrix.image_tag }}
    steps:
      - name: Refresh mirrors
        run: |
          pacman-key --init
          pacman --noconfirm -Syu
      - name: Install pacaur
        if: matrix.helper == 'pacaur'
        run: aur-install pacaur
      - run: runuser -u ab -- ${{ matrix.helper }} --noconfirm -S meta-package-manager
      - run: runuser -u ab -- ${{ matrix.helper }} --noconfirm -S meta-package-manager-bin
      - run: mpm --version

  # https://pip.pypa.io/en/stable/
  pip:
    name: "✅ pip (${{ matrix.os }})"
    strategy:
      matrix:
        os:
          - ubuntu-26.04-arm
          - ubuntu-26.04
          - macos-15-intel
          - macos-26
          - windows-11-arm
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pin what CI downloads: unpinned, setup-uv installs the newest uv
          # satisfying `required-version`. `sync-workflow-pins` bumps it once a
          # uv release clears the cooldown window.
          version: "0.12.1"
      - name: Install Python
        run: uv --no-progress venv --python 3.14
      - name: Run CLI via pip
        run: |
          pip install meta-package-manager
          mpm                  --version
          meta-package-manager --version

  # https://pipx.pypa.io/
  pipx:
    name: "✅ pipx (${{ matrix.os }})"
    strategy:
      matrix:
        os:
          - ubuntu-26.04-arm
          - ubuntu-26.04
          - macos-15-intel
          - macos-26
          - windows-11-arm
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pin what CI downloads: unpinned, setup-uv installs the newest uv
          # satisfying `required-version`. `sync-workflow-pins` bumps it once a
          # uv release clears the cooldown window.
          version: "0.12.1"
      - name: Install Python
        run: uv --no-progress venv --python 3.14
      - name: Run stable CLI via pipx
        run: |
          uv --no-progress tool install pipx
          pipx run                             meta-package-manager --version
          pipx run --spec meta-package-manager mpm                  --version
          pipx run --spec meta-package-manager meta-package-manager --version
          uv --no-progress tool uninstall pipx
      - name: Run dev CLI via pipx
        run: |
          uv --no-progress tool install pipx
          pipx run --spec git+https://github.com/kdeldycke/meta-package-manager mpm                  --version
          pipx run --spec git+https://github.com/kdeldycke/meta-package-manager meta-package-manager --version

  # https://scoop.sh/#/apps?q=meta-package-manager
  # https://github.com/ScoopInstaller/Main/blob/master/bucket/meta-package-manager.json
  scoop:
    name: "✅ scoop (${{ matrix.os }})"
    strategy:
      matrix:
        os:
          - windows-2025      # x86
          - windows-11-arm    # arm64
    runs-on: ${{ matrix.os }}
    steps:
      - shell: pwsh
        run: |
          iwr get.scoop.sh -outfile 'install.ps1'
          .\install.ps1 -RunAsAdmin
          # Force addition of Scoop shims to PATH for subsequent steps.
          "$env:USERPROFILE\scoop\shims" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8
      - shell: pwsh
        run: scoop install main/meta-package-manager
      - shell: pwsh
        run: mpm --version

  # https://docs.astral.sh/uv/
  uv:
    name: "✅ uv (${{ matrix.os }})"
    strategy:
      matrix:
        os:
          - ubuntu-26.04-arm
          - ubuntu-26.04
          - macos-15-intel
          - macos-26
          - windows-11-arm
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Pin what CI downloads: unpinned, setup-uv installs the newest uv
          # satisfying `required-version`. `sync-workflow-pins` bumps it once a
          # uv release clears the cooldown window.
          version: "0.12.1"
      - name: Install Python
        run: uv --no-progress venv --python 3.14
      - name: Run stable CLI
        run: |
          uvx           meta-package-manager                                --version
          uvx    --from meta-package-manager        -- mpm                  --version
          uv run --with meta-package-manager        -- mpm                  --version
          uv run --with meta-package-manager        -- meta-package-manager --version
          uv run --with meta-package-manager        -m meta_package_manager --version
          uv run --with meta-package-manager python -m meta_package_manager --version
      - name: Run stable CLI via uv tool
        run: |
          uv --no-progress tool install meta-package-manager
          mpm                  --version
          meta-package-manager --version
          uv --no-progress tool uninstall meta-package-manager
      - name: Run dev CLI
        run: |
          uvx    --from git+https://github.com/kdeldycke/meta-package-manager        -- mpm                  --version
          uvx    --from git+https://github.com/kdeldycke/meta-package-manager        -- meta-package-manager --version
          uv run --with git+https://github.com/kdeldycke/meta-package-manager        -- mpm                  --version
          uv run --with git+https://github.com/kdeldycke/meta-package-manager        -- meta-package-manager --version
          uv run --with git+https://github.com/kdeldycke/meta-package-manager        -m meta_package_manager --version
          uv run --with git+https://github.com/kdeldycke/meta-package-manager python -m meta_package_manager --version
      - name: Run dev CLI via uv tool
        run: |
          uv --no-progress tool install git+https://github.com/kdeldycke/meta-package-manager
          mpm                  --version
          meta-package-manager --version

  # https://github.com/lucasgelfond/zerobrew
  zerobrew:
    name: "✅ zerobrew (${{ matrix.os }}, ${{ matrix.asset }})"
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04-arm
            asset: zb-linux-arm64
          - os: ubuntu-26.04
            asset: zb-linux-x64
          - os: macos-15-intel
            asset: zb-darwin-x64
          - os: macos-26
            asset: zb-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install ZeroBrew
        run: >
          gh release download v0.3.0
          --repo lucasgelfond/zerobrew
          --pattern "${{ matrix.asset }}"
          --output /usr/local/bin/zb
          --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - run: chmod +x /usr/local/bin/zb
      - name: Initialize ZeroBrew
        run: |
          zb init
          {
            echo "$HOME/.zerobrew/bin"
            echo "$HOME/.local/share/zerobrew/prefix/bin"
            echo "/opt/zerobrew/bin"
          } >> "$GITHUB_PATH"
      - run: zb install meta-package-manager
      - run: mpm --version
