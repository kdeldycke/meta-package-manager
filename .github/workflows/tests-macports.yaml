---
name: 🧪 Test MacPorts ports
"on":
  workflow_dispatch:

permissions: {}

# Temporary: runs the `port test` phase of the ports in packaging/macports/,
# which neither the `macports-source` job of tests-install.yaml nor the CI of
# macports-ports runs. Delete this file once it passes.

# Supply-chain cooldown, held equal to `[tool.repomatic] minimum-release-age`.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"

jobs:

  port-test:
    name: "port test (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15-intel
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MacPorts
        run: |
          MACOS_MAJOR="$(sw_vers -productVersion | cut -d . -f 1)"
          gh release download \
            --repo macports/macports-base \
            --pattern "MacPorts-*-${MACOS_MAJOR}-*.pkg" \
            --output macports.pkg
          sudo installer -pkg macports.pkg -target /
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          echo "/opt/local/sbin" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Sync official ports tree
        run: sudo port -v sync
      - name: Register overlay ports tree
        run: |
          cp -R ./packaging/macports /Users/Shared/mpm-ports
          chmod -R a+rX /Users/Shared/mpm-ports
          portindex /Users/Shared/mpm-ports
          { echo "file:///Users/Shared/mpm-ports"; cat /opt/local/etc/macports/sources.conf; } > sources.conf
          sudo cp sources.conf /opt/local/etc/macports/sources.conf
      # MacPorts fetches the next archive in the background while it installs the
      # current one, and that fetch races the main one over the same `.sig` file.
      - name: Turn off the background archive fetch
        run: echo "fetch_threads 0" | sudo tee -a /opt/local/etc/macports/macports.conf
      # A library port runs its test phase on its versioned subport, like
      # py314-cloup. Every port runs, even after one fails.
      - name: Run the test phases
        run: |
          fail=0
          for port in py314-cloup py314-extra-platforms py314-click-extra meta-package-manager; do
            echo "::group::port test ${port}"
            sudo port -v test "${port}" || fail=1
            echo "::endgroup::"
          done
          exit "${fail}"
