# TEMPORARY probe workflow, to be deleted once it is known whether `winget list --source winget` lists every installed
# application winget matches to its catalog, including those it did not install, and nothing else.
---
name: 🔬 WinGet installed probe
"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/winget-installed-probe.yaml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Supply-chain cooldown: no package published within the window can be resolved
# by any command in this workflow. Held equal to `[tool.repomatic]
# minimum-release-age`. See claude.md for the rationale.
env:
  NPM_CONFIG_MIN_RELEASE_AGE: 7
  UV_EXCLUDE_NEWER: "1 week"
  # Same workaround as tests.yaml, for Windows runners redirecting output to files.
  PYTHONIOENCODING: "utf8"

jobs:

  probe:
    name: WinGet installed on windows-2025
    runs-on: windows-2025
    permissions: {}
    timeout-minutes: 20
    steps:
      - name: WinGet - Windows install
        shell: pwsh
        run: >
          winget upgrade winget --accept-package-agreements --accept-source-agreements --disable-interactivity
          || & { "ignore failure"; $global:LASTEXITCODE = 0 }

      - name: Version
        shell: bash {0}
        run: winget --version

      - name: Raw details listing, winget source only
        shell: bash {0}
        run: |
          winget list --source winget --details --accept-source-agreements --disable-interactivity --no-progress \
            > filtered.txt 2>&1
          echo "winget exit code: $?"
          cat filtered.txt

      - name: Raw details listing, every source
        shell: bash {0}
        run: |
          winget list --details --accept-source-agreements --disable-interactivity --no-progress > all.txt 2>&1
          echo "winget exit code: $?"
          cat all.txt

      - name: "Gate: the source filter keeps catalog matches and drops nothing winget installed"
        shell: bash
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path

          header = re.compile(r"^(?:\(\d+/\d+\)\s+)?(\S.+)\s+\[([^\]]+)\]\s*$", re.MULTILINE)

          def blocks(path):
              text = Path(path).read_text(encoding="UTF-8", errors="replace")
              matches = list(header.finditer(text))
              parsed = {}
              for match, end in zip(matches, [*(m.start() for m in matches[1:]), len(text)]):
                  body = text[match.end():end]
                  origin = re.search(r"^Origin Source:\s*(.*)$", body, re.MULTILINE)
                  parsed[match.group(2)] = origin.group(1).strip() if origin else None
              return parsed

          filtered = blocks("filtered.txt")
          every = blocks("all.txt")
          print(f"blocks with --source winget: {len(filtered)}")
          print(f"blocks without it: {len(every)}")
          print("origins kept:", Counter(filtered.values()).most_common())

          def shape(package_id):
              if package_id.startswith(("ARP\\", "MSIX\\")):
                  return "local identifier"
              if re.fullmatch(r"(?:[0-9A-Z]{12}|XP[0-9A-Z]{12})", package_id):
                  return "store ID"
              return "catalog ID"

          dropped = {pid: origin for pid, origin in every.items() if pid not in filtered}
          print("dropped by shape:", Counter(shape(pid) for pid in dropped).most_common())
          print("dropped origins:", Counter(dropped.values()).most_common())
          for pid in sorted(pid for pid in dropped if shape(pid) == "catalog ID"):
              print(f"  dropped catalog ID: {pid} (origin {dropped[pid]!r})")

          assert filtered, "the source-filtered listing holds no package"
          assert set(filtered) <= set(every), "the filter listed a package the plain listing lacks"
          assert None in filtered.values(), "no package installed outside winget was kept"
          assert "winget" not in dropped.values(), "the filter dropped a package winget installed"
          PY
