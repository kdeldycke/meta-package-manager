[queued]
aqua = "Project scope, tracked in issue 1725. Every operation resolves the nearest `aqua.yaml`, so the listing reports what a config declares rather than what the host holds. Reassess if aquaproj/aqua#1900 gives `install` a package argument."
bower = "Project scope, tracked in issue 1725. Alive, and its own readme steers new work elsewhere: \"While Bower is maintained, we recommend yarn and webpack or parcel for new front-end projects!\" What disqualifies it here is that it resolves into `bower_components/` inside a working tree."
cabal = "Project scope, tracked in issue 1725. `cabal outdated` answers for a package description or freeze file, there is no `uninstall` in any scope, and `cabal list --installed` needs GHC present to run at all."
glide = "Project scope, tracked in issue 1725. Alive, and it manages \"the vendor directory within a Go package\", which is a working tree rather than a machine."
netpkg = "A Zenwalk host. Assessed: it is that distribution's own manager, adding dependency metadata over Slackware `.tgz` packages, and Zenwalk still releases, its newest being dated 2025-01-16. What has to be settled against a real install is its relationship to `slapt-get`, which mpm wraps and which Zenwalk is also compatible with."
poetry = "Project scope, tracked in issue 1725. The archetype of the group, named in the `scope` docstring of `meta_package_manager/manager.py`."
protonplus = "A Linux host with a Steam-like launcher, and a Python class: every verb is keyed on a launcher-and-runner pair, which a bundled definition cannot compose."
protonup = "A dead-upstream recheck after 2026-10-19. The supersession premise failed, the repository being unarchived and its readme carrying no deprecation notice, so the calendar is all that is left."

stack = "Project scope, tracked in issue 1725. Predominantly a project build tool: no inventory, no outdated, and an `uninstall` that only prints instructions. The one host-wide axis it owns, fetching GHC, belongs to the wrapped `ghcup`."
upkg = "A paldo host. Assessed: it is that distribution's own manager, building from source or installing binaries against XML specifications, and paldo still releases, announcing GNOME 50.1 and Linux 7.0 on 2026-05-13."
vite-plus = "Project scope, tracked in issue 1725. Its help groups one verb under Package Manager Commands, `install`, and every flag it carries is a `package.json` concept. No global install flag, no listing, no removal."
