# Per-manager competitor support flags and homepage URLs for the benchmark
# page.
#
# This file encodes which managers each *competing* tool supports. The mpm
# column on the page is auto-derived from the live pool of supported managers
# (see `meta_package_manager/pool.py`). When adding a new manager to mpm, its
# row appears automatically: only competitor data needs to be tracked here.
#
# Schema:
#
#   [managers]
#   <manager-id> = [<competitor>, ...]
#
#   [homepages]
#   <manager-id> = "<https-url>"
#
# `managers` keys must be lower-case manager identifiers. Each value is an
# array (possibly empty) of competing tools that support that manager, chosen
# from: topgrade, upt, pacaptr, metapac.
#
# `homepages` only needs to contain URLs for managers that mpm does not
# implement. For mpm-implemented managers the homepage is sourced from the
# class's `homepage_url` attribute. Cross-tool naming differences are
# resolved by using mpm's identifier as the canonical row key: a flag means
# "this competitor supports the manager identified by this row", even if the
# competitor internally calls it something else (like topgrade's
# `brew_formula` for our `brew`).
#
# `coarse_support` is a third table with entries shaped like `managers`.
# Entries record (manager_id, competitor) pairs where the competitor can only
# upgrade the manager as part of a coarser umbrella step, never in isolation.
# Topgrade's `Step::Shell` and `Step::Vim` are the canonical examples:
# `--only shell` runs *every* zsh/bash/fish plugin manager the host has
# installed, so asking topgrade to upgrade just `antibody` (or just
# `vundle`) is impossible. Cells in the support table render as `≈[^coarse]`
# instead of `✓` for these pairs. Every coarse entry must also exist in
# `managers` (you cannot be coarse-only-supported without being supported at
# all).
#
# `queued` is an alphabetically-sorted table mapping manager id to the one
# thing that blocks its wrap. These are candidates rather than refusals:
# each has been assessed against the vetting ladder and each would be
# written today if the assessing host had an Arch box, a Hyprland session,
# a Windows machine or, for the two waiting on a dead-upstream recheck, a
# later date. Their `mpm` cell renders `QUEUED_GLYPH` unlinked, which is
# what separates them from the blank cell of a tool nobody has looked at.
# A manager cannot be both queued and unsupported, nor queued and wrapped:
# landing the wrap is what removes its entry here.
#
# `unsupported` is an alphabetically-sorted table mapping manager id to
# status, for the managers `mpm` deliberately does not wrap, the status
# picking the glyph its `mpm` cell renders (see `UNSUPPORTED_GLYPHS` in
# `_docs.py`). The glyph links to the decision recorded in
# `docs/unsupported.md`, so a refusal reads differently from a blank cell,
# which means nobody has assessed the tool yet. The link target is not
# repeated here: it lives once in `_docs.py`'s `UNSUPPORTED_DOCS_URL`. Only
# settled decisions belong here. A tool framed as a *not yet* (the
# project-scoped ecosystems) keeps a blank cell, since a glyph would
# overstate it. A manager cannot be both wrapped and unsupported: the
# wrapped-but-abandoned ones render `⚠️` from their `unmaintained` flag
# instead, and stay out of this mapping.
# `test_unsupported_page_matches_benchmark` holds every key in lockstep with
# a row of `docs/unsupported.md`.
#
# `refused` records (manager_id, competitor, evidence_url) triples where the
# competitor has *explicitly declined* to support the manager, with a link to
# the specific issue, PR, or comment carrying the refusal. Cells in the
# support table render as `[❌](url)` for these pairs, letting readers audit
# each claim against the upstream decision. The evidence link must point to a
# concrete refusal (a maintainer comment, a `NOT_PLANNED` closure, a rejected
# PR), not a generic repo homepage: absence of support without a documented
# decision stays a blank cell. A (manager_id, competitor) pair cannot appear
# in both `managers` and `refused` for the same competitor.
#
# A duplicate manager-id row anywhere in this file (in any table) is a TOML
# parse error, not a silently-overwritten value: unlike the YAML this file
# used to be, `tomllib` rejects a repeated key outright.

