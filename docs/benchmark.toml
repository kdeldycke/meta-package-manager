# Two clusters share this table, both topgrade-driven:
#   - Zsh/Bash/Fish plugin managers under `Step::Shell` (`antibody`,
#     `antidote`, `antigen`, `bash-it`, `fish-plug`, `fisher`, `fundle`,
#     `oh-my-bash`, `oh-my-fish`, `oh-my-zsh`, `zgenom`, `zim`, `zinit`,
#     `zplug`, `zr`). `topgrade --only shell` runs all of them.
#   - Vim/Neovim plugin managers under `Step::Vim` (`dein`, `lazy`, `mason`,
#     `neobundle`, `packer-nvim`, `paq`, `plug`, `voom`, `vundle`).
#     `topgrade --only vim` runs all of them.
# Entries are sorted alphabetically rather than grouped by cluster so the
# well-formedness test stays simple. Each maps competitor to url, linking to
# the maintainer's own confirmation of the coarse bundling (like the
# `Step::Shell` / `Step::Vim` acknowledgement in topgrade discussion #961).
# Cells render as `[🟡](url)`.
[coarse_support.antibody]
topgrade = "https://github.com/topgrade-rs/topgrade/issues/961#issuecomment-2420924279"

[coarse_support.antidote]
topgrade = "https://github.com/topgrade-rs/topgrade/issues/961#issuecomment-2420924279"

[coarse_support.antigen]
topgrade = "https://github.com/topgrade-rs/topgrade/issues/961#issuecomment-2420924279"

[coarse_support.bash-it]
topgrade = "https://github.com/topgrade-rs/topgrade/issues/961#issuecomment-2420924279"

[coarse_support.dein]
topgrade = "https://github.com/topgrade-rs/topgrade/issues/961#issuecomment-2420924279"

[coarse_support.fish-plug]
topgrade = "https://github.com/topgrade-rs/topgrade/issues/961#issuecomment-2420924279"

[coarse_support.fisher]
topgrade = "https://github.com/topgrade-rs/topgrade/issues/961#issuecomment-2420924279"

[coarse_support.fundle]
topgrade = "https://github.com/topgrade-rs/topgrade/issues/961#issuecomment-2420924279"

# One `Go` step runs `go-global-update` and `gup` back to back, so neither
# can be asked for on its own, and the same step is the only route topgrade
# has to anything `go install` put on the machine.
[coarse_support.go]
