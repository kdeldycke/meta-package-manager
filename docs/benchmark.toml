# Each entry records a manager the competitor explicitly declined to
# implement, keyed by manager-id then by competitor, with the value being the
# URL of the refusal (issue closed as NOT_PLANNED, maintainer comment,
# rejected PR). Procedural closures (like "please reopen using the correct
# template" that never got a followup) count as refusals here too: the
# request was made, the issue was closed, no support followed. Entries and
# their nested keys are sorted alphabetically.
[refused.cabal]
topgrade = "https://github.com/topgrade-rs/topgrade/issues/320#issuecomment-3536466336"

# Managers left unwrapped by decision, each carrying its reason in the table
# of `docs/unsupported.md`. The value is the tool's own status, which picks
# the glyph rendered in the `mpm` column (see `UNSUPPORTED_GLYPHS` in
# `_docs.py`):
#
#   archived: upstream is retired, so the tool is dead whatever mpm does.
#   excluded: upstream is alive; mpm declined it on its own merits, either
#             because it owns no package registry (`declaro`, `decman`,
#             `metapac`, `upt`) or because it exposes no unattended entry
#             point to drive (`pckr-nvim`).
#
# Keys are sorted alphabetically, and every key needs a matching row in
# `docs/unsupported.md`: the glyph links there for the reason.
