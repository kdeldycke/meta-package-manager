# Bundled package-manager definition shipped with mpm.
#
# bin installs binaries straight from GitHub releases and similar sources
# (https://github.com/marcosnils/bin). See docs/overrides.md ("Define a new
# manager") for the schema and meta_package_manager/definitions.py
# (build_bundled_managers) for the loader.
#
# The package identifier is the absolute path of the installed binary, which is
# what `list` reports and what `remove` and `update` accept. That choice is
# forced rather than preferred: bin names a package differently depending on the
# verb. Installing takes a source spec (`github.com/junegunn/fzf`, a release-tag
# URL, `goinstall://…`, `docker://…`, a vendor host), while everything
# afterwards is keyed on the installed path. Handing a source spec back to
# `remove` does not resolve, and a bare basename resolves through `$PATH` first,
# so a managed binary shadowed by another copy on `$PATH` fails outright. The
# absolute path is the only identifier every non-installing operation accepts.
#
# That asymmetry is also why `install` is not declared: no identifier `list`
# reports can be handed to it, so mpm could never install what it had just
# listed. Installing through bin stays a `bin install <spec>` the user runs
# themselves, and mpm reports and maintains the result.
#
# No `outdated`, though bin can compute it. `update --dry-run` exits 3 when it
# finds updates and 0 when it finds none, and prints the listing to stderr while
# leaving stdout empty. A declarative operation is one argument list whose
# stdout is parsed on a zero exit, so neither half of that fits: the operation
# needs a Python class to express. `upgrade --all` is unaffected.
#
# No `search`: bin has no registry to search, only sources the user names. No
# `sync`: there is no index to refresh. `bin prune` is left alone too, since it
# drops configuration entries whose file has vanished rather than cleaning up
# packages.
#
# `NO_COLOR` is set because bin colors on its own initiative whenever `CI` is
# non-empty, which every GitHub Actions run sets: without it CI would parse ANSI
# a local run never produces. bin colors its two streams through separate
# libraries and only one of them honors `NO_COLOR`, but that one is `fatih/color`
# governing the stdout table, which is the only stream anything below parses. The
# `caarlos0/log` lines on stderr stay colored under CI and are nobody's input
# here, being the payload of the `outdated` this definition does not declare.
#
# No escalation: bin installs into a directory it picked from `$PATH` for being
# writable, and never needs root.
#
# ```{caution}
# A `bin` that has never been configured prompts for its download directory on
# *every* command, the listing included, and cannot be driven until someone
# answers once interactively. mpm sees that as a failed version probe and treats
# the manager as unavailable, which is the right outcome: an uninitialised bin
# has no inventory to report, and reporting zero packages would be a lie.
# ```

[mpm.managers.bin]
name = "bin"
homepage_url = "https://github.com/marcosnils/bin"
platforms = ["linux_like", "macos", "windows"]
cli_names = ["bin"]
requirement = ">=0.27.0"
# The release whose listing layout the sample below reproduces: it reserves a
# leading column of the version field for the pin marker. The parser tolerates
# the older unreserved layout too, but the floor tracks what is verified.
extra_env = { NO_COLOR = "1" }
# `bin --version` prints four lines; the version is the third word of the first,
# bare and without a `v`. There is no `version` subcommand.
version_regexes = ['^bin version (?P<version>\S+)']

# A four-column table padded with at least two spaces between cells, each column
# as wide as its widest value, so no column sits at a fixed offset and the
# separator is the only thing worth anchoring on. Three details drive the
# pattern. The first column is a path and may itself contain a single space, so
# it is matched lazily up to the first run of two. The version is preceded by a
# reserved column carrying `*` when the binary is pinned, which the optional
# marker consumes so it never lands in the version. And the status column is
# either `OK` or `missing <path>`, the latter carrying spaces of its own, so the
# pattern is anchored on it at the end rather than counting fields. A row whose
# version or URL is empty collapses to three columns and correctly fails to
# match, rather than silently shifting a URL into the version field.
[mpm.managers.bin.operations.installed]
args = ["list"]
regex = '^(?P<package_id>\S.*?)\s{2,}\*?(?P<installed_version>\S+)\s{2,}\S+\s{2,}(?:OK|missing .*)$'

# ```{warning}
# `remove` reports a name it could not resolve on stderr and still exits 0, so a
# zero exit here means the command ran, not that anything was removed. Confirm a
# removal by listing again.
# ```
[mpm.managers.bin.operations.remove]
args = ["remove", "{package_id}"]

# `--yes` answers the single batch confirmation `update` asks before applying,
# and `--continue-on-error` keeps one failing binary from abandoning the rest of
# the run. Unlike some whole-system upgraders, naming a binary genuinely
# restricts the run to it.
[mpm.managers.bin.operations.upgrade_one]
args = ["update", "--yes", "--continue-on-error", "{package_id}"]

[mpm.managers.bin.operations.upgrade_all]
args = ["update", "--yes", "--continue-on-error"]

# Output samples locking the version probe and the declared parser. Consumed by
# tests/test_manager_definition.py; ignored by mpm's loader.
#
# Both are taken from a real `0.29.1` run. The listing keeps that run's package
# identities, versions and source URLs, which cover the forms that make the
# pattern non-trivial: a bare `owner/repo` source, a release-tag URL, a vendor
# host, and a pinned entry carrying the `*` marker. Only the install directory
# is changed, from the throwaway one that run used to an ordinary one, with the
# column padding recomputed by the same rule, itself checked to reproduce the
# captured rows byte for byte.
[samples.version]
output = """
bin version 0.29.1
commit: c24db4aced89c855062fe8e2907ae0deb3fb9f53
built at: 2026-08-02T13:37:10Z
built by: goreleaser"""
expected = "0.29.1"

[[samples.installed]]
output = """
/home/user/.local/bin/fzf         v0.74.2  github.com/junegunn/fzf                                    OK
/home/user/.local/bin/rg          14.1.1   https://github.com/BurntSushi/ripgrep/releases/tag/14.1.1  OK
/home/user/.local/bin/terraform  *1.5.7    releases.hashicorp.com/terraform                           OK"""
packages = [
  { id = "/home/user/.local/bin/fzf", version = "v0.74.2" },
  { id = "/home/user/.local/bin/rg", version = "14.1.1" },
  { id = "/home/user/.local/bin/terraform", version = "1.5.7" },
]
