# Chocolatey is the community package manager for Windows.
# See docs/overrides.md ("Define a new manager") for the schema and
# meta_package_manager/definitions.py (build_bundled_managers) for the loader.
#
# Parsing notes:
#   - Every operation passes `--limit-output`, whose pipe-delimited rows are the
#     machine-readable format, with `--no-progress` and `--no-color` riding along
#     as post_args on every invocation. Nothing else may join them without being
#     driven first: Chocolatey's parser hands an option it does not recognize to
#     the command as a positional argument, so `list` and `outdated` filter on it
#     and match nothing, while `search` folds it into the query and the feed
#     answers 406. All three fail silently, returning an empty inventory rather
#     than an error.
#   - `choco search` reaches into all package metadata by default: the
#     {id_name_only_args} template narrows it to package IDs for mpm's default
#     `--id-name-only` mode, and {exact_args} maps `--exact`.
#   - `--by-id-only` answers nothing for a search term under four characters,
#     and the community feed reports `0 packages found` at exit 0 rather than
#     refusing. Measured against Chocolatey 2.7.4: `vim`, `git`, `zip`, `gcc`
#     and `foo` all return empty, while `curl`, `make`, `java`, `7zip` and
#     `python` return results. `--exact` is unaffected and finds `vim` either
#     way, so a short query is only ever short-changed in the default mode.
#
# The version floor is the first release where `choco list` reports installed
# packages without the removed `--local-only` flag.

[mpm.overrides.choco]
name = "Chocolatey"
homepage_url = "https://chocolatey.org"
logo = "chocolatey"
platforms = ["windows"]
keywords = ["chocolatey"]
cli_names = ["choco"]
# 2.0.0 is the first version not requiring the --local-only option on `choco list`,
# which has been entirely removed. Source:
# https://docs.chocolatey.org/en-us/guides/upgrading-to-chocolatey-v2-v6#the-list-command-now-lists-local-packages-only-and-the-local-only-and-lo-options-have-been-removed
requirement = ">=2.0.0"
post_args = ["--no-progress", "--no-color"]
# Chocolatey installs into C:\ProgramData\chocolatey and locks that path down to
# administrators on purpose, so every write to it needs elevation:
# https://docs.chocolatey.org/en-us/default-chocolatey-install-reasoning/
# Measured on Windows 11 24H2 with Chocolatey 2.7.4, each operation run twice,
# once at medium integrity and once at high: the four marked below fail at
# medium with `Access to the path ... is denied` and exit 1, while `list`,
# `outdated` and `search` answer the same either way.
default_sudo = true

# `choco list --limit-output` prints one "id|version" row per installed package.
[mpm.overrides.choco.operations.installed]
args = ["list", "--limit-output"]
regex = '^(?P<package_id>.+)\|(?P<installed_version>.+)$'

# `choco outdated --limit-output` prints "id|installed|latest|pinned" rows.
[mpm.overrides.choco.operations.outdated]
args = ["outdated", "--limit-output"]
regex = '^(?P<package_id>.+)\|(?P<installed_version>.+)\|(?P<latest_version>.+)\|.+$'

[mpm.overrides.choco.operations.search]
args = ["search", "{query}", "--limit-output", "{id_name_only_args}", "{exact_args}"]
id_name_only_args = ["--by-id-only"]
exact_args = ["--exact"]
regex = '^(?P<package_id>.+)\|(?P<latest_version>.+)$'

# Unelevated, `--yes` does not cover the extra prompt Chocolatey raises about
# running without admin rights: it asks "Do you want to continue?" and answers
# itself after 20 seconds. The install then fails on the first write anyway, so
# escalating is what keeps that prompt out of the concurrent fan-out.
[mpm.overrides.choco.operations.install]
args = ["install", "{package_id}", "--yes", "--limit-output"]
sudo = true

[mpm.overrides.choco.operations.remove]
args = ["uninstall", "{package_id}", "--yes", "--limit-output"]
sudo = true

[mpm.overrides.choco.operations.upgrade_one]
args = ["upgrade", "{package_id}", "--yes", "--limit-output"]
sudo = true

# Exits 0 unelevated when nothing is outdated, having attempted no write at all,
# so it is marked from the runs that had real work to do.
[mpm.overrides.choco.operations.upgrade_all]
args = ["upgrade", "all", "--yes", "--limit-output"]
sudo = true

# Output samples locking the version probe and the declared parsers, derived
# from the upstream tool's own source code or documentation. Consumed by
# tests/test_manager_definition.py; ignored by mpm's loader.
[samples.version]
output = "2.2.2"
expected = "2.2.2"

[[samples.installed]]
output = """
adobereader|11.0.10
ccleaner|5.03.5128
chocolatey|0.9.9.2
ConEmu|14.9.23.0
gimp|2.8.14.1
git|1.9.5.20150114"""
packages = [
  { id = "adobereader", version = "11.0.10" },
  { id = "ccleaner", version = "5.03.5128" },
  { id = "chocolatey", version = "0.9.9.2" },
  { id = "ConEmu", version = "14.9.23.0" },
  { id = "gimp", version = "2.8.14.1" },
  { id = "git", version = "1.9.5.20150114" },
]

[[samples.outdated]]
output = """
7zip.commandline|16.02.0.20170209|16.02.0.20170209|false
atom|1.23.3|1.24.0|false
bulkrenameutility|3.0.0.1|3.0.0.1|false"""
packages = [
  { id = "7zip.commandline", version = "16.02.0.20170209" },
  { id = "atom", version = "1.24.0" },
  { id = "bulkrenameutility", version = "3.0.0.1" },
]

[[samples.search]]
output = """
virtualbox|6.1.0
VirtualBox.ExtensionPack|5.1.10.20161223
enigmavirtualbox|9.20
virtualbox-guest-additions-guest.install|6.1.0"""
packages = [
  { id = "virtualbox", version = "6.1.0" },
  { id = "VirtualBox.ExtensionPack", version = "5.1.10.20161223" },
  { id = "enigmavirtualbox", version = "9.20" },
  { id = "virtualbox-guest-additions-guest.install", version = "6.1.0" },
]
