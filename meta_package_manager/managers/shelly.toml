# Shelly is a package manager for Arch Linux driving `libalpm` directly
# (https://github.com/Seafoam-Labs/Shelly-ALPM). See docs/overrides.md ("Define
# a new manager") for the schema and meta_package_manager/definitions.py
# (build_bundled_managers) for the loader.
#
# ```{note}
# Only the *standard* half is wrapped, the ALPM repository packages
# [`pacman`](pacman.md) also reaches, so a host carrying both reports those
# packages twice under two ids. Shelly drives three more package universes
# behind their own type selector, `aur`, `flatpak` and `appimage`, and each
# answers a separate call: one operation is one command, so a definition
# cannot merge them into a single listing.
# ```
#
# ```{caution}
# Shelly escalates on its own, calling `sudo` from inside every mutating
# operation, so `mpm` never wraps it: an escalated call would stack sudo on
# sudo. Off a terminal it answers `sudo: a terminal is required to read the
# password` and exits `1`, so an unattended run needs a warm credential cache
# or a `NOPASSWD` policy. See {doc}`/sudo`.
# ```
#
# Parsing notes, verified by driving 3.1.1 and 3.0.0+9 on Arch Linux:
#   - Every query reads `--json` and prints a flat top-level array of one
#     object per package. `installed` and `search` carry the version under
#     `Version`; `list-updates` splits it into `CurrentVersion` and
#     `NewVersion`.
#   - `search standard <query>` returns a bare *object* describing one exact
#     package when no source modifier is passed, which no array parser can
#     read. `--available` is what turns it into an array over the
#     synchronization databases, so it is not optional here.
#   - That search already matches descriptions, so `--extended` is its native
#     behaviour and no flag narrows it back to names: mpm refilters instead.
#   - `--no-confirm` sits in `pre_args` because every mutating verb prompts
#     otherwise, and shelly accepts the flag before or after its subcommand.
#   - `upgrade standard` is the whole-system path and `update standard
#     <packages>` the per-package one, which is the split mpm needs. Neither
#     reads the other's arguments.
#   - `purify standard` always plans corrupted archives, and `--cache` and
#     `--orphans` add their own targets to that plan.

[mpm.managers.shelly]
name = "Shelly"
homepage_url = "https://github.com/Seafoam-Labs/Shelly-ALPM"
logo = "archlinux"
# Its own prerequisites name "Arch Linux (or an Arch-based distribution)", and
# it links against the `libalpm` that `pacman` provides.
platforms = ["arch", "cachyos", "endeavouros", "manjaro"]
cli_names = ["shelly"]
# 3.0.0+9 answers `list`, `list-updates` and `search` with the same JSON as
# 3.1.1, both driven here. The 2.x series numbered releases on four parts and
# is not covered.
requirement = ">=3.0.0"
# Every verb prompts for confirmation, and the flag is global.
pre_args = ["--no-confirm"]
version_cli_options = ["--version"]
# A bare version on its own line. A release may carry build metadata, 3.0.0+9
# being one, so the pattern reaches past the three numbers.
version_regexes = ['(?P<version>\d+\.\d+\.\d+\S*)']

[mpm.managers.shelly.operations.installed]
args = ["list", "standard", "--json"]
format = "json"
fields = { package_id = "Name", installed_version = "Version" }

[mpm.managers.shelly.operations.outdated]
args = ["list-updates", "standard", "--json"]
format = "json"
fields = { package_id = "Name", installed_version = "CurrentVersion", latest_version = "NewVersion" }

[mpm.managers.shelly.operations.search]
args = ["search", "standard", "{query}", "--available", "--json"]
format = "json"
fields = { package_id = "Name", latest_version = "Version" }

[mpm.managers.shelly.operations.install]
args = ["install", "standard", "{package_id}"]

[mpm.managers.shelly.operations.remove]
args = ["remove", "standard", "{package_id}"]

[mpm.managers.shelly.operations.upgrade_one]
args = ["update", "standard", "{package_id}"]

[mpm.managers.shelly.operations.upgrade_all]
args = ["upgrade", "standard"]

[mpm.managers.shelly.operations.sync]
args = ["sync", "standard"]

[mpm.managers.shelly.operations.cleanup_cache]
args = ["purify", "standard", "--cache"]

[mpm.managers.shelly.operations.cleanup_orphan]
args = ["purify", "standard", "--orphans"]

