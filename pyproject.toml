[tool.actionlint]
# actionlint reads no pyproject section of its own: repomatic serializes this
# one to a temporary YAML config and passes it via `--config-file`. actionlint
# validates a literal `runs-on:` against a built-in label list that does not
# yet carry GitHub's Ubuntu 26.04 preview images, so it rejects them as
# unknown. Declaring them here is the mechanism actionlint's own error message
# points to. They are ordinary GitHub-hosted images, not self-hosted runners:
# that key is simply where actionlint accepts a label it does not ship. Drop
# this section once rhysd/actionlint#682 ships in a release. Meanwhile it opens
# no hole: a typo'd runner is still caught by `lint-repo`'s own check against
# KNOWN_RUNNERS.
self-hosted-runner.labels = [ "ubuntu-26.04", "ubuntu-26.04-arm" ]

[tool.gitleaks]
# Extend gitleaks' built-in ruleset instead of replacing it: this section is
# bridged to a standalone .gitleaks.toml, and without `useDefault` a custom
# config carries only the allowlist below and zero detection rules.
extend.useDefault = true
allowlist.description = "False positives"
allowlist.commits = [
  # Old Travis CI HOMEBREW_GITHUB_API_TOKEN (revoked).
  "ee7613d49366694877177d82e207e870afb3cc1f",
  # Example brew cask output containing API_KEY="abcdef123456".
  "745247e5c74122de9ec2dd95cbd3b8510fe224d5",
  "e31111be719406940519f52c9d4406e97fb368a3",
  # Self-referential: the comment two lines above quotes that same example key,
  # so the commit that introduced this allowlist trips the rule it declares, and
  # the later lint pass that reformatted the line trips it again. Do not restate
  # the key when adding an entry here, or the new commit joins this list too.
  "59964752fbec127082c1eec606e1d21ea2610554",
  "2cd5a08e24d1fbe6519c82fb1846066c3b0d446d",
]

[tool.yamllint]
# Restates repomatic's bundled default, plus one delta: the generated
# docs/assets/managers/logos.yaml records each brand mark's provenance as a
# commit-pinned upstream URL, which pushes a `source:` line past the cap with no
# whitespace to wrap at. `allow-non-breakable-words` does not cover it, as the
# long token sits in an inline mapping rather than alone on its line. Flagging a
# line no edit can shorten only yields unfixable errors, and the generator would
# re-emit one on the next long URL. Prose and comments still wrap at 120.
rules.line-length.max = 120
rules.line-length.allow-non-breakable-words = true
rules.line-length.allow-non-breakable-inline-mappings = true

[tool.click-extra]
# Declarative CLI test suite for binary testing. Repomatic's test and release
# workflows run `click-extra test-suite` against the built binary; that engine
# (the `test-plan` engine, renamed and moved upstream into click-extra 8.1)
# resolves its cases from this section. Without it, click-extra looks for its
# default `./tests/cli-test-suite.toml`, finds nothing, and silently falls back
# to a trivial built-in suite, so the binary self-test must point here explicitly.
#
# The plan is TOML, not YAML: the binary self-test runs `click-extra test-suite`
# through a bare `uv run --frozen` (base dependencies only), and click-extra 8.1
# reads TOML via the standard-library `tomllib` with no format extra. YAML and the
# other formats need their `click-extra[<fmt>]` extra, which the bare runner lacks,
# so a YAML plan raises "YAML support disabled" before any case runs.
test-suite.file = "./tests/cli-test-plan.toml"
